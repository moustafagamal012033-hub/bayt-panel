<title>لوحة الفلوس</title>

<style>
  :root { --bg:#f6f4f8; --card:#fff; --ink:#1d1b20; --muted:#6b6670; --accent:#d6336c; --line:#ece8ef; --red:#e03131; --green:#2f9e44; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151316; --card:#211e23; --ink:#f2eff4; --muted:#a59fa9; --line:#2f2b31; --red:#ff6b6b; --green:#51cf66; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,"Segoe UI",Tahoma,sans-serif; }
  header { background:var(--accent); color:#fff; padding:16px 16px 12px; }
  header h1 { margin:0 0 10px; font-size:18px; }
  .tabs { display:flex; gap:6px; }
  .tabs button { flex:1; min-width:0; border:0; border-radius:10px; padding:6px 2px; background:rgba(255,255,255,.2); color:#fff; font-size:12px; white-space:nowrap; }
  /* 5 تبويبات من موجة ٤: الأيقونة فوق والاسم تحتها، زي شريط التطبيق. */
  .tabs button i { display:block; font-style:normal; font-size:17px; line-height:1.3; }
  .tabs button.on { background:#fff; color:var(--accent); font-weight:700; }
  main { padding:12px 16px 32px; }
  .card { background:var(--card); border-radius:16px; padding:14px; margin-bottom:12px; }
  .kpis { display:flex; gap:8px; }
  .kpi { flex:1; text-align:center; }
  .kpi b { display:block; font-size:20px; }
  .kpi span { color:var(--muted); font-size:12px; }
  .kpi b, .item b, .day h3 span, .ltr { direction:ltr; unicode-bidi:isolate; }
  .donut { display:flex; align-items:center; gap:14px; }
  .donut svg { width:140px; height:140px; flex:none; }
  .legend { flex:1; font-size:13px; }
  .legend div { display:flex; align-items:center; gap:8px; margin:4px 0; }
  .legend b { color:var(--muted); font-weight:600; direction:ltr; unicode-bidi:isolate; }
  .daily { text-align:center; color:var(--muted); font-size:13px; margin:-4px 0 12px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-left:6px; }
  .bar { margin:10px 0; }
  .bar .row { display:flex; justify-content:space-between; font-size:14px; }
  .bar .track { height:6px; background:var(--line); border-radius:3px; margin-top:4px; }
  .bar .fill { height:6px; border-radius:3px; }
  .day h3 { font-size:13px; color:var(--muted); margin:14px 0 6px; display:flex; justify-content:space-between; }
  /* كل حركة كارت صغير بلون تصنيفها، والكلام فوقه بلون اللوحة عشان يفضل مقروء (طلب 2026-10-30).
     والرقم بلون التصنيف ممزوج بلون الكلام، فبيفتح في الوضع الغامق ويغمق في الفاتح. */
  .item { --c:var(--muted); display:flex; justify-content:space-between; gap:8px; padding:9px 12px; margin:6px 0; border-radius:12px; border-inline-start:4px solid var(--c); background:color-mix(in srgb, var(--c) 16%, transparent); font-size:14px; }
  .item b { color:color-mix(in srgb, var(--c) 60%, var(--ink)); }
  .item small { color:var(--muted); display:block; }
  .msg { text-align:center; color:var(--muted); padding:40px 0; }
  .tap { cursor:pointer; }
  /* شريط الفترات والزراير المقسومة، زي التطبيق في الفيديو المرجعي (موجة ١، 2026-10-29). */
  .chips { display:flex; gap:6px; overflow-x:auto; margin:0 -16px 12px; padding:0 16px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chips button { flex:none; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:999px; padding:6px 14px; font-size:13px; }
  .chips button.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .seg { display:flex; background:var(--line); border-radius:10px; padding:3px; margin-bottom:12px; }
  .seg button { flex:1; border:0; background:none; color:var(--muted); padding:7px; border-radius:8px; font-size:14px; }
  .seg button.on { background:var(--card); color:var(--ink); font-weight:700; }
  /* التقويم: كل يوم بلون صرفه أو دخله، وأول عمود من اليمين الأحد. */
  .cal { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal .hd { text-align:center; font-size:11px; color:var(--muted); padding-bottom:4px; }
  .cd { min-height:52px; border-radius:8px; padding:4px 2px; text-align:center; font-size:12px; background:var(--bg); }
  .cd b { display:block; font-size:13px; }
  .cd small { display:block; font-size:10px; direction:ltr; }
  .cd.out { background:color-mix(in srgb, var(--red) 16%, transparent); color:var(--red); }
  .cd.in { background:color-mix(in srgb, var(--green) 16%, transparent); color:var(--green); }
  .cd .g { color:var(--green); }
  .cd.off { opacity:.35; }
  .cd.blank { background:none; }
  .note { text-align:center; color:var(--muted); font-size:13px; margin-top:10px; }
  .note b { color:var(--ink); direction:ltr; unicode-bidi:isolate; }
  /* الدايرة بتتسحب 3 صفحات، والنقط تحتها بتقول إنت فين. */
  .pager { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; }
  .pager::-webkit-scrollbar { display:none; }
  .page { flex:0 0 100%; scroll-snap-align:start; min-height:150px; }
  .dots { display:flex; justify-content:center; gap:6px; margin-top:8px; }
  .dots i { width:7px; height:7px; border-radius:50%; background:var(--line); }
  .dots i.on { background:var(--muted); }
  svg.line { width:100%; height:130px; display:block; }
  .sum { display:flex; justify-content:space-between; font-size:13px; color:var(--muted); margin-top:6px; }
  .sum b { color:var(--ink); direction:ltr; unicode-bidi:isolate; }
  .back { display:flex; align-items:center; gap:10px; font-size:17px; font-weight:700; margin-bottom:12px; }
  .back span { font-size:20px; }
  .mrow { display:grid; grid-template-columns:1.2fr 1fr 1fr 1fr; gap:6px; padding:9px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .mrow b { text-align:left; direction:ltr; unicode-bidi:isolate; font-weight:600; }
  .mrow.th { color:var(--muted); font-size:12px; }
  .mrow.th span:not(:first-child) { text-align:left; }
  .yr { color:var(--muted); font-size:12px; margin-top:12px; }
  .neg { color:var(--red); } .pos { color:var(--green); }
  /* شباك التفاصيل من تحت: بيتفتح بدوسة على أي حركة أو يوم. */
  .sheet { position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; align-items:flex-end; z-index:5; }
  .sheet.on { display:flex; }
  .sh { background:var(--card); width:100%; border-radius:18px 18px 0 0; padding:18px 16px 24px; max-height:80vh; overflow:auto; }
  .shhd { text-align:center; font-size:30px; margin-bottom:4px; }
  .shhd b { display:block; font-size:17px; }
  .kv { display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .kv span { color:var(--muted); flex:none; }
  .kv b { text-align:left; font-weight:600; }
  /* رقم المبلغ في شباك الحركة بلون تصنيفها وتقيل، زي القايمة (اختيار ١، 2026-10-30). */
  .kv .amt { color:color-mix(in srgb, var(--c) 60%, var(--ink)); font-weight:700; font-size:19px; }
  .sh .close { width:100%; margin-top:14px; border:0; border-radius:12px; padding:11px; background:var(--accent); color:#fff; font-size:15px; }
  .stat { flex:1; text-align:center; border-radius:12px; padding:10px; background:var(--card); }
  .stat b { display:block; font-size:24px; color:var(--st); }
  .stat span { font-size:12px; color:var(--st); }
  .cmd { padding:12px 14px; cursor:pointer; }
  .cmd .row { display:flex; align-items:center; gap:10px; }
  .cmd .ic { font-size:22px; flex:none; }
  .cmd .tt { flex:1; min-width:0; }
  .cmd .tt b { display:block; font-size:15px; }
  .cmd .tt small { display:block; color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cmd .ago { font-size:12px; color:var(--muted); flex:none; }
  .cmd .next { margin-top:8px; padding:6px 10px; border-radius:10px; background:var(--line); font-size:13px; }
  .cmd .more { display:none; margin-top:8px; padding-top:8px; border-top:1px solid var(--line); font-size:12px; color:var(--muted); line-height:1.7; }
  .cmd.open .more { display:block; }
  .done { --st:#2f9e44; } .waiting, .pulled { --st:#f08c00; }
  .stat { cursor:pointer; border:2px solid transparent; }
  .stat.on { border-color:var(--st); }
  /* ميزانية الشهر (موجة ٢): دايرة زي التطبيق، وشرطة بتقول الشهر وصل لفين النهارده. */
  .bud { display:flex; align-items:center; gap:14px; }
  .bud svg { width:112px; height:112px; flex:none; }
  .bud .kvs { flex:1; }
  .bud .kv { padding:6px 0; }
  .bud-t { margin:0 0 10px; font-size:15px; }
  .pace { font-size:13px; color:var(--muted); margin-top:10px; padding-top:10px; border-top:1px solid var(--line); text-align:center; }
  .pace b { color:var(--ink); direction:ltr; unicode-bidi:isolate; }
  /* ميزانية كل تصنيف: كارت صغير لكل واحد، اتنين جنب بعض، ودوسة بتفتح صفحة التصنيف. */
  .cbs { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .cb { display:flex; align-items:center; gap:8px; background:var(--bg); border-radius:12px; padding:8px; min-width:0; }
  .cb svg { width:58px; height:58px; flex:none; }
  .cb div { min-width:0; }
  .cb b { display:block; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cb small { display:block; font-size:11px; color:var(--muted); }
  .cb small span { direction:ltr; unicode-bidi:isolate; }
  /* موجة ٣: زراير التعديل في شباك الحركة، واللي اتلغى بيبان باهت ومشطوب. */
  .acts { display:flex; gap:8px; margin-top:14px; }
  .acts button { flex:1; border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:12px; padding:11px 6px; font-size:14px; }
  .acts button.warn { color:var(--red); border-color:color-mix(in srgb, var(--red) 40%, transparent); }
  .acts button.sure { background:var(--red); color:#fff; border-color:var(--red); }
  .lock { margin-top:14px; padding:10px 12px; border-radius:12px; background:var(--bg); color:var(--muted); font-size:13px; line-height:1.6; }
  .cats { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:6px; }
  .cats button { border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:12px; padding:11px 6px; font-size:14px; }
  .cats button.on { border-color:var(--accent); color:var(--accent); font-weight:700; }
  .toast { text-align:center; padding:14px 0 4px; font-size:15px; }
  .item.cx { opacity:.55; }
  .item.cx b { text-decoration:line-through; }
  /* أقسام التقارير زي التطبيق: زرار بيفتح الكارت كله أو يقفله. */
  .sec-h { display:flex; justify-content:space-between; align-items:center; width:100%; border:0; background:var(--card); color:var(--ink); border-radius:14px; padding:13px 14px; margin-bottom:12px; font:inherit; font-size:15px; font-weight:700; cursor:pointer; }
  .sec-h i { font-style:normal; color:var(--muted); }
  .sec-h.on i { color:var(--accent); }
  /* موجة ٤ (#60): حسابين زي التطبيق، جوّه قسم «الحسابات» اللي بيبدأ مقفول. */
  .acc-top { text-align:center; padding:18px 14px; }
  .acc-top span { color:var(--muted); font-size:13px; }
  .acc-top b { display:block; font-size:30px; margin:6px 0 0; }
  .acc-h { display:flex; justify-content:space-between; font-size:13px; color:var(--muted); padding-bottom:8px; border-bottom:1px solid var(--line); }
  .acc-h b { color:var(--ink); }
  .acc { display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--line); }
  .acc:last-child { border-bottom:0; }
  .acc .ic { font-size:24px; flex:none; }
  .acc div { flex:1; min-width:0; }
  .acc div b { display:block; font-size:15px; }
  .acc small { color:var(--muted); font-size:12px; }
  .acc > b { font-size:16px; }
  /* تبويب «الأسبوع» (2026-11-05): شكل النسخة المدمجة من نظام التصميم، ومحبوس كله جوّه .wk عشان ما يلمسش تبويبات الفلوس. */
  .wk { --ground:#fbf9f4; --card:#ffffff; --ink:#1c2541; --ink-soft:#4a5370; --frame:#5b6886; --hairline:rgba(91,104,134,.22); --track:#eef0f5; --highlight:#9c5a00; --concept-fill:#e7f5ff; --concept-border:#a5d8ff; --solution-fill:#ebfbee; --solution-border:#b2f2bb; --warning-fill:#fff5f5; --warning-border:#ffc9c9; --question-fill:#f3f0ff; --question-border:#d0bfff; --badge-fill:#fff9db; --ok:#2b8a3e; --mid:#b26a00; --bad:#c92a2a; --ghost:#c3c9d8; --s1:8px; --s2:16px; --s3:24px; --s4:32px; --r-card:16px; --r-pill:999px; --stroke:2px; --f-head:"Noto Kufi Arabic","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif; --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif; --f-emoji:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji"; --ease:cubic-bezier(.2,.7,.2,1); }
  @media (prefers-color-scheme: dark) { .wk { --ground:#10172a; --card:#172036; --ink:#e9edf6; --ink-soft:#a9b2c8; --frame:#7a87a6; --hairline:rgba(169,178,200,.16); --track:#222c45; --highlight:#f0b04a; --concept-fill:#1a2c45; --concept-border:#3d6a99; --solution-fill:#16322a; --solution-border:#2f7a4a; --warning-fill:#3a1f27; --warning-border:#8a3a46; --question-fill:#272448; --question-border:#5b4fa0; --badge-fill:#3a3218; --ok:#51cf66; --mid:#fcc419; --bad:#ff8787; --ghost:#46506b; } }
  .wk { color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.6; max-width:860px; margin:0 auto; }
  .wk button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; text-align:inherit; }
  /* تصفير اللي جاي من تنسيق الفلوس بنفس الأسامي. */
  .wk .card { margin:0; } .wk .kpi { text-align:start; } .wk .bar { margin:0; } .wk .note { text-align:start; }
  .wk .chips { margin:0; overflow:visible; } .wk .chips button { flex:none; border:0; background:none; }
  .wk .task.lock { margin:0; padding:9px 0; border-radius:0; background:none; color:inherit; font-size:inherit; line-height:inherit; }
  .wk .top { display:block; } .wk .top .title { font-size:20px; }
  .wk button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
  .wk button:focus-visible{outline:2px solid var(--highlight);outline-offset:2px;border-radius:10px}
  .wk .emo{font-family:var(--f-emoji);font-style:normal}
  .wk .num{font-variant-numeric:tabular-nums}
  .wk .wrap{max-width:860px;margin:0 auto;padding:var(--s2) var(--s2) 40px}
  .wk .top{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s1)}
  .wk .title{font-family:var(--f-head);font-weight:700;font-size:22px;line-height:1.5;margin:0}
  .wk .sub{color:var(--ink-soft);font-size:13px;margin:0}
  .wk .iconbtn{width:36px;height:36px;border-radius:50%;border:var(--stroke) solid var(--hairline);display:grid;place-items:center;flex:none;background:var(--card)}
  .wk .iconbtn svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .wk .sample{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:2px 10px;border-radius:var(--r-pill);
    background:var(--badge-fill);border:1.5px solid var(--frame);font-size:12px;font-weight:600}
  .wk .seg{display:flex;gap:4px;margin:var(--s2) 0;padding:4px;border-radius:var(--r-card);background:var(--card);border:var(--stroke) solid var(--frame)}
  .wk .seg button{flex:1;padding:8px 6px;border-radius:12px;font-size:13px;font-weight:600;color:var(--ink-soft);text-align:center;transition:background .25s var(--ease),color .25s}
  .wk .seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
  .wk .seg small{display:block;font-weight:500;font-size:11px;opacity:.85}
  .wk .grid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
  .wk .card,.wk .grid>*{min-width:0}
  .wk .card{background:var(--card);border:var(--stroke) solid var(--frame);border-radius:var(--r-card);padding:var(--s2)}
  .wk .h{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s1);margin:0 0 10px}
  .wk .h h2{font-family:var(--f-head);font-weight:700;font-size:16px;line-height:1.5;margin:0}
  .wk .h .aside{font-size:12px;color:var(--ink-soft);white-space:nowrap}
  .wk .hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s2);align-items:center}
  .wk .ring{width:118px;height:118px;position:relative;flex:none}
  .wk .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .wk .ring .t{fill:none;stroke:var(--track);stroke-width:10}
  .wk .ring .g{fill:none;stroke:var(--ghost);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .9s var(--ease)}
  .wk .ring .v{fill:none;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .9s var(--ease),stroke .4s}
  .wk .ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
  .wk .ring .p{font-family:var(--f-head);font-weight:700;font-size:28px;line-height:1.2}
  .wk .ring .l{font-size:11px;color:var(--ink-soft)}
  .wk .hero .lead{font-size:15px;font-weight:600;margin:0 0 6px}
  .wk .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .wk .kpi{border:1.5px solid var(--hairline);border-radius:12px;padding:8px}
  .wk .kpi .k{font-size:11.5px;color:var(--ink-soft);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wk .kpi .n{font-family:var(--f-head);font-weight:700;font-size:20px;line-height:1.4}
  .wk .kpi .cmp{display:block;height:4px;border-radius:4px;background:var(--track);margin-top:4px;position:relative;overflow:hidden}
  .wk .kpi .cmp i{position:absolute;inset-block:0;right:0;border-radius:4px;background:var(--ink);transition:width .8s var(--ease)}
  .wk .kpi .cmp b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--frame)}
  .wk .delta{display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:600;white-space:nowrap;direction:rtl}
  .wk .delta svg{width:10px;height:10px}
  .wk .delta.up{color:var(--ok)}
  .wk .delta.down{color:var(--bad)}
  .wk .delta.flat,.wk .delta.na{color:var(--ink-soft)}
  .wk .delta.up svg path,.wk .delta.down svg path{fill:currentColor}
  .wk .vs{font-size:12px;color:var(--ink-soft)}
  .wk .days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:120px;padding-top:6px}
  .wk .day{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
  .wk .stack{width:100%;max-width:30px;display:flex;flex-direction:column-reverse;gap:2px;position:relative;height:80px;justify-content:flex-start}
  .wk .stack .blk{height:0;border-radius:5px;transition:height .7s var(--ease)}
  .wk .stack .blk.d{background:var(--ink)}
  .wk .stack .blk.u{background:transparent;border:1.5px dashed var(--frame)}
  .wk .stack .prev{position:absolute;left:-3px;right:-3px;height:2px;background:var(--highlight);border-radius:2px;transition:bottom .7s var(--ease)}
  .wk .day .dl{font-size:11px;color:var(--ink-soft);white-space:nowrap}

    kv('الميزانية', fmt(amount)) + kv('اتصرف', fmt(spent)) + kv(over ? 'اتجاوزت' : 'فاضل', signed(left), left < 0 ? 'neg' : 'pos') +
    `</div></div><div class="pace">${pace}</div></div>`;
}
// «أخرى» ظرف لكل تصنيف مالوش ميزانية لوحده، عشان كل درهم يظهر في كارت (اختيار 2026-11-01).
const OTHER = 'أخرى';
const inOther = (cat) => cat === OTHER || (catBudgets.some((b) => b.category === OTHER) && !catBudgets.some((b) => b.category === cat));
// كروت ميزانية التصنيفات: الصرف من by_category بتاع نفس الشهر، وتصنيف ما اتصرفش فيه بيبان 0%.
function catBudgetsCard(d, ym) {
  if (!catBudgets.length || !ym) return '';
  const spent = {};
  (d.by_category || []).forEach((c) => { spent[c.category] = Number(c.total); });
  // مهمة ٢٣: ميزانية بصفر أو فاضية ما بتترسمش (كانت بتطبع NaN%).
  return `<div class="card"><h4 class="bud-t">🗂️ ميزانية التصنيفات</h4><div class="cbs">` + catBudgets.filter((b) => Number(b.amount) > 0).map((b) => {
    const s = b.category === OTHER ? (d.by_category || []).reduce((a, c) => a + (inOther(c.category) ? Number(c.total) : 0), 0) : spent[b.category] || 0;
    const st = budgetState(s, Number(b.amount), ym);
    return `<div class="cb tap" data-act="bcat" data-v="${esc(b.category)}" data-c="${color(b.category, false)}">${ring(st, false, color(b.category, false))}
      <div><b>${label(b.category)}</b><small><span>${fmt(s)}</span> من <span>${fmt(b.amount)}</span></small>` +
      `<small class="${st.over ? 'neg' : 'pos'}">${st.over ? 'اتجاوزت' : 'فاضل'} <span>${fmt(Math.abs(st.left))}</span></small></div></div>`;
  }).join('') + `</div></div>`;
}
// ظرف لوحده (اختيار 2026-11-01): ميزانية التصنيف اللي عليها outside، زي الأهل، صرفها ما بيتحسبش في كارت ميزانية الشهر.
const outsideSpent = (d) => (d.by_category || []).reduce((a, c) =>
  a + (catBudgets.some((b) => b.outside && b.category === c.category) ? Number(c.total) : 0), 0);
const periodMonth = () => (S.period === 'month' ? curMonth() : S.period === 'last_month' ? prevMonth(curMonth()) : /^\d{4}-\d{2}$/.test(S.period) ? S.period : '');
const itemRow = (it, extra) => `<div class="item tap" data-act="item" data-v="${it.id}" style="--c:${color(it.category, it.kind === 'income')}"><div>${esc(it.name_ar || it.note || it.category)}<small>${label(it.category)} · ${extra}</small></div><b>${sign(it)}${fmt(it.amount)}</b></div>`;

// خط كل يوم: أول يوم على اليمين زي التطبيق، والنقطة الملوّنة يوم فيه حركة.
function line(pts, col) {
  const W = 300, H = 130, P = 12, n = pts.length, max = Math.max(1, ...pts.map((p) => p.v));
  const x = (i) => (n < 2 ? W / 2 : W - P - i * (W - 2 * P) / (n - 1));
  const y = (v) => H - 20 - (v / max) * (H - 38);
  const poly = pts.map((p, i) => `${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const dotsSvg = pts.map((p, i) => p.v > 0
    ? `<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3.5" fill="${col}"/>`
    : `<circle cx="${x(i).toFixed(1)}" cy="${y(0).toFixed(1)}" r="1.6" fill="var(--muted)"/>`).join('');
  const lab = (i) => `<text x="${x(i).toFixed(1)}" y="${H - 4}" text-anchor="middle" font-size="10" fill="var(--muted)">${Number(pts[i].day.slice(8, 10))}</text>`;
  return `<svg class="line" viewBox="0 0 ${W} ${H}">
    <line x1="${P}" x2="${W - P}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>
    <polyline points="${poly}" fill="none" stroke="${col}" stroke-width="1.5" opacity=".55"/>${dotsSvg}
    ${lab(0)}${n > 2 ? lab(Math.floor((n - 1) / 2)) : ''}${n > 1 ? lab(n - 1) : ''}
    <text x="${P}" y="12" font-size="10" fill="var(--muted)">${fmt(max)}</text></svg>`;
}
function series(d, pred) {
  const m = {};
  flat(d).filter(pred).forEach((i) => { m[i.day] = (m[i.day] || 0) + val(i); });
  return dates(d.from, d.to).map((day) => ({ day, v: m[day] || 0 }));
}
const sumAvg = (pts) => {
  const t = pts.reduce((a, p) => a + p.v, 0);
  return `<div class="sum"><span>المجموع: <b>${fmt(t)}</b></span><span>المعدل في اليوم: <b>${fmt(pts.length ? t / pts.length : 0)}</b></span></div>`;
};

// 🧾 المعاملات: الأرقام التلاتة، وبعدها قايمة بالأيام أو تقويم الشهر.
function renderTx(d) {
  const all = flat(d);
  let h = chips() + kpis(d.total_expense, d.total_income) + budgetCard(Number(d.total_expense) - outsideSpent(d), periodMonth()) + daily(d.last_daily) + seg('mode', [['list', '📃 قايمة'], ['cal', '📅 تقويم']], S.mode);
  // اللي اتلغى من اللوحة في الفترة دي: باهت ومشطوب، وبرّه كل الأرقام، ودوسة عليه بتفتح زرار «رجّع».
  // وبيظهر حتى لو مفيش ولا حركة تانية، عشان آخر حركة اتلغت تفضل ترجع.
  const cx = cancelled.filter((c) => c.day >= d.from && c.day <= d.to);
  cx.forEach((c) => { byId[c.id] = { ...c, cancelled: true }; });
  const cxCard = !cx.length ? '' : `<div class="card"><div class="day"><h3><span>❌ اتلغت من اللوحة</span><span>${cx.length}</span></h3>` +
    cx.map((c) => itemRow(c, `${dayName(c.day)} · ${esc(c.time)}`).replace('class="item tap"', 'class="item tap cx"')).join('') + `</div></div>`;
  if (!all.length) return app.innerHTML = h + '<div class="msg">مفيش حركات في الفترة دي.</div>' + cxCard;
  if (S.mode === 'cal') return app.innerHTML = h + calendar(d, all) + cxCard;
  h += `<div class="card">` + (d.days || []).map((day) => `<div class="day"><h3><span>${esc(day.day)}</span><span>${dayTotal(day.total)}</span></h3>` +
    day.items.map((it) => itemRow(it, `${srcName(it.source)} · ${esc(it.time)}`)).join('') + `</div>`).join('') + `</div>`;
  app.innerHTML = h + cxCard;
}
function calendar(d, all) {
  const spend = {}, inc = {}, has = {};
  all.forEach((i) => { has[i.day] = true; if (i.kind === 'income') inc[i.day] = (inc[i.day] || 0) + Number(i.amount); else spend[i.day] = (spend[i.day] || 0) + val(i); });
  const week = S.period === 'week';
  const first = week ? d.from : d.from.slice(0, 8) + '01';
  const y = Number(d.from.slice(0, 4)), m = Number(d.from.slice(5, 7));
  const last = week ? d.to : new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10);
  const pad = new Date(first + 'T00:00:00Z').getUTCDay();
  const heads = ['أحد', 'اتنين', 'تلات', 'أربع', 'خميس', 'جمعة', 'سبت'].map((t) => `<div class="hd">${t}</div>`).join('');
  const cells = '<div class="cd blank"></div>'.repeat(pad) + dates(first, last).map((day) => {
    const s = spend[day] || 0, n = inc[day] || 0, inside = day >= d.from && day <= d.to;
    const cls = s > 0 ? 'out' : n > 0 || s < 0 ? 'in' : '', any = has[day];
    return `<div class="cd ${cls}${inside ? '' : ' off'}${any ? ' tap' : ''}" ${any ? `data-act="day" data-v="${day}"` : ''}><b>${Number(day.slice(8, 10))}</b>` +
      (s ? `<small>${dayTotal(s)}</small>` : '') + (n ? `<small class="g">+${fmt(n)}</small>` : '') + `</div>`;
  }).join('');
  const days = dates(d.from, d.to).length;
  return `<div class="card"><div class="cal">${heads}${cells}</div>
    <div class="note">متوسط الصرف في اليوم: <b>${dayTotal(d.total_expense / days)}</b> درهم</div>
    <div class="note"><i class="dot" style="background:var(--red)"></i>يوم فيه صرف &nbsp; <i class="dot" style="background:var(--green)"></i>يوم فيه دخل بس</div></div>`;
}

// 📊 الإحصائيات: نفقات ولا دخل، والدايرة 3 صفحات، وكل تصنيف بيفتح صفحته.
function catsOf(d) {
  if (S.kind === 'expense') return d.by_category || [];
  const g = {};
  flat(d).filter((i) => i.kind === 'income').forEach((i) => { g[i.category] = g[i.category] || { category: i.category, total: 0, count: 0 }; g[i.category].total += Number(i.amount); g[i.category].count++; });
  return Object.values(g).sort((a, b) => b.total - a.total);
}
function renderStats(d) {
  const cats = catsOf(d), total = cats.reduce((a, c) => a + Number(c.total), 0), pos = posSum(cats, (c) => c.total), inc = S.kind === 'income';
  let h = chips() + seg('kind', [['expense', '💸 نفقات'], ['income', '💰 دخل']], S.kind);
  if (!cats.length) return app.innerHTML = h + `<div class="msg">مفيش ${S.kind === 'income' ? 'دخل' : 'نفقات'} في الفترة دي.</div>`;
  const perDay = {};
  flat(d).filter(isKind).forEach((i) => { perDay[i.day] = (perDay[i.day] || 0) + val(i); });
  const top = Object.entries(perDay).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
  const topCats = top.slice(0, 5).map(([day, v]) => ({ category: day, total: v }));
  const rest = top.slice(5).reduce((a, [, v]) => a + v, 0);
  if (rest > 0) topCats.push({ category: 'أخرى', total: rest });
  const col = S.kind === 'income' ? '#2f9e44' : '#d6336c';
  const pts = series(d, isKind);
  h += `<div class="card"><div class="pager">
    <div class="page donut">${donut(cats, total, (c) => color(c.category, inc))}<div class="legend">` +
      cats.map((c) => `<div><span><i class="dot" style="background:${color(c.category, inc)}"></i>${label(c.category)}</span><b>${pct(c.total, pos)}%</b></div>`).join('') + `</div></div>
    <div class="page donut">${donut(topCats, total, (c, i) => dayColor(i))}<div class="legend"><div><small style="color:var(--muted)">أكبر الأيام</small></div>` +
      topCats.map((c, i) => `<div><span><i class="dot" style="background:${dayColor(i)}"></i>${c.category === 'أخرى' ? 'أيام تانية' : dayName(c.category)}</span><b>${fmt(c.total)}</b></div>`).join('') + `</div></div>
    <div class="page">${line(pts, col)}${sumAvg(pts)}</div>
  </div><div class="dots">${[0, 1, 2].map((i) => `<i data-act="page" data-v="${i}" class="tap${S.page === i ? ' on' : ''}"></i>`).join('')}</div></div>`;
  h += `<div class="card">` + cats.map((c) => `<div class="bar tap" data-act="cat" data-v="${esc(c.category)}" data-c="${color(c.category, inc)}">
      <div class="row"><span>${label(c.category)} <small>(${c.count})</small></span><b>${fmt(c.total)}</b></div>
      <div class="track"><div class="fill" style="width:${pos > 0 ? Math.max(2, pct(c.total, pos)) : 0}%;background:${color(c.category, inc)}"></div></div></div>`).join('') + `</div>`;
  app.innerHTML = h;
  const pager = app.querySelector('.pager');
  if (S.page) pager.children[S.page].scrollIntoView({ inline: 'start', block: 'nearest' });
  pager.addEventListener('scroll', () => {
    const p = Math.round(Math.abs(pager.scrollLeft) / pager.clientWidth);
    if (p === S.page) return;
    S.page = p;
    app.querySelectorAll('.dots i').forEach((el, i) => el.classList.toggle('on', i === p));
  }, { passive: true });
}
function renderCat(d) {
  const group = S.group && S.cat === OTHER && S.kind === 'expense';
  const pred = (i) => isKind(i) && (group ? inOther(i.category) : i.category === S.cat);
  const items = flat(d).filter(pred), total = items.reduce((a, i) => a + val(i), 0), pos = posSum(items, val);
  const pts = series(d, pred);
  const sorted = items.slice().sort(S.sort === 'amount' ? (a, b) => val(b) - val(a) : (a, b) => (b.day + b.time).localeCompare(a.day + a.time));
  const cb = S.kind === 'expense' && (S.cat !== OTHER || group) && catBudgets.find((b) => b.category === S.cat);
  const parts = {};
  if (group) items.forEach((i) => { const p = parts[i.category] = parts[i.category] || { category: i.category, total: 0, count: 0 }; p.total += val(i); p.count++; });
  const inner = !group ? '' : `<div class="card"><div class="note">جوّه «أخرى»: كل تصنيف مالوش ميزانية لوحده</div>` +
    Object.values(parts).sort((a, b) => b.total - a.total).map((c) => `<div class="bar"><div class="row"><span>${label(c.category)} <small>(${c.count})</small></span><b>${fmt(c.total)}</b></div>
      <div class="track"><div class="fill" style="width:${pos > 0 ? Math.max(2, pct(c.total, pos)) : 0}%;background:${color(c.category, false)}"></div></div></div>`).join('') + `</div>`;
  app.innerHTML = `<div class="back tap" data-act="back"><span>→</span>${label(S.cat)}</div>` +
    (cb ? budgetCard(total, periodMonth(), Number(cb.amount), `💰 ميزانية ${label(S.cat)}`, S.catColor) : '') +
    inner + `<div class="card">${line(pts, S.catColor)}${sumAvg(pts)}</div>` +
    seg('sort', [['date', '🗓️ فرز بالتاريخ'], ['amount', '💵 فرز بالمبلغ']], S.sort) +
    (!sorted.length ? '<div class="msg">مفيش حركات في التصنيف ده في الفترة دي.</div>' : `<div class="card">` + sorted.map((it) => `<div class="bar tap" data-act="item" data-v="${it.id}">
      <div class="row"><span>${esc(it.name_ar || it.note || it.category)}</span><b class="ltr">${it.kind === 'refund' ? '+' : ''}${fmt(it.amount)}</b></div>
      <div class="track"><div class="fill" style="width:${pos > 0 ? Math.max(2, pct(val(it), pos)) : 0}%;background:${S.catColor}"></div></div>
      <div class="row" style="color:var(--muted);font-size:12px;margin-top:3px"><span>${dayName(it.day)} · <span class="ltr">${esc(it.time)}</span>${group ? ' · ' + label(it.category) : ''}</span><span class="ltr">${pct(val(it), pos)}%</span></div></div>`).join('') + `</div>`);
}

// 📑 التقارير زي التطبيق: «إحصائيات الشهر» و«الحسابات» زرارين، كل دوسة بتفتح الكارت كله أو تقفله
// (طلب 2026-10-30)، وتحتهم جدول كل الشهور. دوسة على شهر تفتح معاملاته.
function renderReports(d) {
  const cur = curMonth(), m0 = months.find((m) => m.month === cur) || { expense: 0, income: 0 };
  const years = [...new Set(months.map((m) => m.month.slice(0, 4)))];
  app.innerHTML = section('stats', `📅 إحصائيات ${monthName(cur)}`, () => kpis(m0.expense, m0.income) + budgetCard(Number(m0.expense) - outsideSpent(d), cur) + catBudgetsCard(d, cur)) +
    section('accounts', '🏦 الحسابات', () => accountsCard(d.accounts)) +
    `<div class="card"><div class="mrow th"><span>الشهر</span><span>نفقات</span><span>دخل</span><span>الفرق</span></div>` +
    years.map((y) => `<div class="yr">${y}</div>` + months.filter((m) => m.month.startsWith(y)).map((m) => {
      const diff = m.income - m.expense;
      return `<div class="mrow tap" data-act="month" data-v="${esc(m.month)}"><span>${MONTHS[Number(m.month.slice(5, 7)) - 1]}</span><b>${fmt(m.expense)}</b><b>${fmt(m.income)}</b><b class="${diff < 0 ? 'neg' : 'pos'}">${signed(diff)}</b></div>`;
    }).join('')).join('') +
    (months.length <= 1 ? `<div class="note">الجدول بيكبر شهر بشهر.</div>` : '') + `</div>`;
}

// زرار القسم: مقفول بيبان سطر واحد، ومفتوح بيبان الكارت كله تحته.
function section(key, title, body) {
  const on = open[key];
  return `<button class="sec-h${on ? ' on' : ''}" data-act="sec" data-v="${key}"><span>${title}</span><i>${on ? '▾' : '◂'}</i></button>` + (on ? body() : '');
}
// 🏦 الحسابات (موجة ٤، #60): الصافي فوق، وتحته البنك من إيميله و«حساب الأموال» = الصافي ناقص البنك.
// القسم بيبدأ مقفول، فالأرقام ما بتبانش غير بدوسة، وبيرجع يتقفل مع أي تبويب تاني، وما بيتحفظش في أي مكان.
function accountsCard(a) {
  if (!a || a.net == null) return '<div class="msg">الحسابات لسه ما اتجهّزتش.</div>';
  const m = (n) => (n == null ? '—' : signed(n));
  return `<div class="card acc-top"><span>صافي القيمة</span><b class="ltr">${m(a.net)}</b></div>` +
    `<div class="card"><div class="acc-h"><span>حساباتي</span><b class="ltr">${m(a.net)}</b></div>` +
    `<div class="acc"><span class="ic">🏦</span><div><b>البنك</b><small>من إيميل البنك · <span class="ltr">${esc(a.hilal_at || '—')}</span></small></div><b class="ltr">${m(a.hilal)}</b></div>` +
    `<div class="acc"><span class="ic">💰</span><div><b>حساب الأموال</b><small>كل فلوسك برّه البنك</small></div><b class="ltr">${m(a.amwal)}</b></div></div>` +
    `<div class="note" style="margin:-4px 0 12px">الصافي بدأ من قياس يوم <span class="ltr">${esc(a.as_of)}</span>، وبيتحرك لوحده مع كل دخل وصرف في اللوحة.</div>`;
}

// شباك التفاصيل: حركة واحدة، أو كل حركات يوم من التقويم.
function openSheet(html) {
  sheet.innerHTML = `<div class="sh">${html}<button class="close" data-act="close">قفل</button></div>`;
  sheet.classList.add('on'); backBtn();
}
function closeSheet() { if (busy) return; sheet.classList.remove('on'); sheet.innerHTML = ''; backBtn(); }
function openItem(id) {
  const it = byId[id]; if (!it) return;
  const kv = (k, v) => `<div class="kv"><span>${k}</span><b>${v}</b></div>`;
  openSheet(`<div class="shhd">${ICON[it.category] || '▫️'}<b>${esc(it.category)}</b></div>` +
    kv('النوع', KIND[it.kind] || esc(it.kind)) +
    kv('المبلغ', `<span class="ltr amt" style="--c:${color(it.category, it.kind === 'income')}">${sign(it)}${fmt(it.amount)}</span> درهم`) +
    kv('التاريخ', `${dayName(it.day)} ${it.day.slice(0, 4)} · <span class="ltr">${esc(it.time)}</span>`) +
    kv('المصدر', srcName(it.source)) +
    // #62: الاسم العربي للعرض، والاسم الأصلي من إيميل البنك تحته كدليل.
    (it.name_ar ? kv('المحل', esc(it.name_ar)) + kv('في البنك', esc(it.note)) : kv('الملاحظة', esc(it.note || '—'))) + itemActions(it));
}
// موجة ٣: التعديل لحد ما الحركة تنزل «💸 سجل الفلوس»، وبعدها الملف هو المالك والتصليح برسالة لكلود.
function itemActions(it) {
  if (it.cancelled) return it.locked
    ? `<div class="lock">🔒 الحركة دي اتلغت، ونزلت في 💸 «سجل الفلوس» بعلامة ❌.</div>`
    : `<div class="lock">❌ الحركة دي اتلغت من اللوحة، ومش محسوبة في أي رقم.</div><div class="acts"><button data-act="restore" data-v="${it.id}">↩️ رجّع الحركة</button></div>`;
  if (it.status === 'synced_to_file') return `<div class="lock">🔒 الحركة دي نزلت في 💸 «سجل الفلوس»، فالملف بقى هو المالك. ولو عايز تصلّح حاجة، ابعت لكلود.</div>`;
  return `<div class="acts">` + (it.kind === 'income' ? '' : `<button data-act="pickcat" data-v="${it.id}">🏷️ غيّر التصنيف</button>`) +
    `<button class="warn" data-act="cancel1" data-v="${it.id}">❌ إلغاء الحركة</button></div>`;
}
function pickCategory(id) {
  const it = byId[id]; if (!it) return;
  // الثابتة الأول، وبعدها أي تصنيف مصروف جديد شايفاه الصفحة. والباب هو اللي بيحكم في الآخر.
  const seen = Object.values(byId).filter((i) => i.kind !== 'income').map((i) => i.category).concat(catBudgets.map((b) => b.category));
  const names = [...new Set(Object.keys(ICON).filter((c) => c !== 'دخل ATM').concat(seen))].filter((c) => c && c !== '❓'); // الباب بيرفض ❓
  openSheet(`<div class="shhd">🏷️<b>اختار التصنيف</b></div><div class="cats">` +
    names.map((c) => `<button data-act="setcat" data-v="${it.id}" data-c="${esc(c)}" class="${c === it.category ? 'on' : ''}">${label(c)}</button>`).join('') + `</div>`);
}
const RESULT = { changed: '✅ اتعمل', same: '👌 مفيش تغيير', locked: '🔒 الحركة نزلت الملف خلاص، فالتصليح برسالة لكلود', missing: '⚠️ الحركة مش موجودة', bad: '⚠️ التصنيف ده ما ينفعش هنا' };

async function doWrite(body) {
  if (busy) return;

  let msg;
  try {
    // مهمة ٢٣: مهلة 15 ثانية، والشبكة لو وقعت بتتقال بالعربي، لأن الكتابة ممكن تكون وصلت الباب.
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 15000);
    let r;

    catch { throw new Error('الاتصال وقع قبل ما الرد يوصل. الحركة ممكن تكون اتعملت أو لأ، فبص عليها في القايمة.'); }

    if (r.status === 401) throw new Error('مش قادر أتأكد إنه إنت. اقفل اللوحة وافتحها تاني من زرار البوت.');
    if (!r.ok) throw new Error('في عطل في الاتصال. جرّب تاني.');

}

// تبويب «الأوامر»: نظرة سريعة. كارت مقفول فيه الحالة والعنوان والنتيجة و«👣 الجاي»،
// والرسالة والأوقات بتفتح لما يدوس (اختيار ١، 2026-10-28).
function ago(ts) {
  const m = Math.max(0, Math.round((Date.now() / 1000 - Number(ts)) / 60));
  if (m < 1) return 'دلوقتي';
  if (m < 60) return `من ${m} دقيقة`;
  const h = Math.round(m / 60);
  if (h < 24) return h === 1 ? 'من ساعة' : h === 2 ? 'من ساعتين' : `من ${h} ساعات`;
  const d = Math.round(h / 24);
  return d === 1 ? 'من يوم' : d === 2 ? 'من يومين' : `من ${d} أيام`;
}
const firstWords = (s) => String(s ?? '').trim().replace(/^\.\s*/, '').split(/\s+/).slice(0, 3).join(' ');
// الرقمين فوق فلاتر: دوسة توري نوع واحد، والدوسة التانية على نفس الرقم ترجّع الكل (اختيار ١، 2026-10-28).
let cmdFilter = null;
function renderCommands(list) {
  if (!list.length) return app.innerHTML = '<div class="msg">مفيش أوامر لسه. ابعت للبوت سطر أوله نقطة.</div>';
  const done = list.filter((c) => c.status === 'done').length;

  app.innerHTML = `<div class="kpis" style="margin-bottom:12px">
    <div class="stat waiting${cmdFilter === 'waiting' ? ' on' : ''}" data-f="waiting"><b>${list.length - done}</b><span>مستني</span></div>
    <div class="stat done${cmdFilter === 'done' ? ' on' : ''}" data-f="done"><b>${done}</b><span>اتنفّذ</span></div></div>` +
    (shown.length ? '' : '<div class="msg">مفيش أوامر هنا.</div>') +
    shown.map((c) => {
      const ok = c.status === 'done';
      const lines = String(c.note ?? '').split('\n').map((l) => l.trim()).filter(Boolean);
      const next = lines.filter((l) => l.startsWith('👣')).join(' · ');
      const sub = ok ? lines.filter((l) => !l.startsWith('👣')).join(' · ') : 'مستني جلسة كلود';
      const title = c.title || firstWords(c.body);
      return `<div class="card cmd ${esc(c.status)}">
        <div class="row"><span class="ic">${ok ? '✅' : '⏳'}</span>
          <div class="tt"><b>${esc(title)}</b><small>${esc(sub)}</small></div>

        <div class="more">رسالتك: «${esc(c.body)}»<br>وصل <span class="ltr">${esc(c.received)}</span>${c.done ? ` · اتنفّذ <span class="ltr">${esc(c.done)}</span>` : ''}</div>

function wkModel(raw) {
  const okDate = (s) => /^\d{4}-\d{2}-\d{2}/.test(String(s ?? ''));
  const weeks = (Array.isArray(raw && raw.weeks) ? raw.weeks : []).filter((w) => w && okDate(w.week_start))
    .sort((a, b) => String(a.week_start).localeCompare(String(b.week_start)))

      out: w.outside_program == null || isNaN(Number(w.outside_program)) ? null : Number(w.outside_program),
      goals: Array.isArray(w.goals) ? w.goals.filter((g) => g && typeof g === 'object') : [], tasks: [] }));
  const at = {}; weeks.forEach((w, i) => { at[w.start] = i; });

    if (!t || !okDate(t.week_start)) return;

    const hidden = t.hidden !== false;

    if (a === NO_ASP) noAsp = true; else if (!aspects.includes(a)) aspects.push(a);
    const p = t.project && String(t.project).trim() ? String(t.project) : NO_PROJ;
    if (!projects.includes(p)) projects.push(p);
    if (hidden) sens[p] = true;
    const g = t.goal && String(t.goal).trim() ? String(t.goal) : null;
    if (g) { if (!goals.includes(g)) goals.push(g); if (!projGoal[p]) projGoal[p] = g; }

    (empty.length ? `<div>أيام فاضية: ${empty.join('، ')}.</div>` : '') +

function rowHTML(kind, id, name, sub, cur, prv, rank) {

    `<span class="bar" aria-hidden="true"><i class="${VCOL[v]}" data-w="${cur.pct || 0}"></i>${marker}</span>` +
    `<span class="val"><span class="pc num">${cur.pct === null ? '—' : cur.pct + '%'}</span>${dl}</span></button>`;

let aspectRank = [];
function renderAspects() {
  const w = ws.w;
  const rows = WK.aspects.map((a) => ({ a, c: wkStats(wkTasks(w, 'aspect', a)), p: w > 0 ? wkStats(wkTasks(w - 1, 'aspect', a)) : null }));

function renderProjects() {

function taskMini(t) {
  const tick = `<span class="chk${t.done ? ' on' : ''}" style="width:18px;height:18px">${t.done ? '<svg viewBox="0 0 12 12"><path d="M2.5 6.2 5 8.5 9.5 3.5"/></svg>' : ''}</span>`;
  return `<li>${tick}<span>${t.hidden ? 'مهمة محمية' : esc(t.t)}</span><span class="vs" style="margin-inline-start:auto">${t.di >= 0 ? WK_DAYS[t.di] : ''}</span></li>`;
}
function renderGoals() {
  const w = ws.w;
  if (!WK.goals.length) { $w('goals').innerHTML = '<p class="note">مفيش أهداف مربوطة بمهام الأسبوع ده.</p>'; return; }
  $w('goals').innerHTML = WK.goals.map((g) => {
    const s = goalStat(w, g), p = w > 0 ? goalStat(w - 1, g) : null, v = verdict(s.pct), open = ws.openGoal === g;
    let pips = ''; for (let i = 0; i < Math.min(s.planned, 31); i++) pips += `<span class="pip" data-c="${i < s.done ? VCOL[v] : ''}"></span>`;
    const ts = wkTasks(w, 'goal', g);
    const list = ts.length ? ts.map(taskMini).join('') : '<li>مفيش مهام مربوطة بالهدف ده الأسبوع ده.</li>';
    return `<button class="goal" data-g="${esc(g)}" aria-expanded="${open}">` +
      `<div class="gh"><b>${esc(g)}</b><span class="tag ${v}">${VNAME[v]}</span></div>` +
      `<div class="gm"><span>المعيار: ${s.target ? esc(s.target) : 'لسه ما اتكتبش'}</span><span><strong class="num">${s.done}</strong> من <span class="num">${s.planned}</span> · ${s.pct === null ? '—' : PCB(s.pct)}</span></div>` +
      `<div class="pips" aria-hidden="true">${pips || '<span class="pip"></span>'}</div>` +
      `<div class="gm" style="margin-bottom:0"><span>${w > 0 ? 'عن الأسبوع اللي فات' : 'أول أسبوع'}</span>${w > 0 ? deltaHTML(s.pct, p.pct, ' نقطة', true) : ''}</div>` +
      `<div class="gt"><ul>${list}</ul></div></button>`;
  }).join('');
  later(() => $w('goals') && $w('goals').querySelectorAll('.pip').forEach((el) => { if (el.dataset.c) el.className = 'pip ' + el.dataset.c; }));
}
function renderPlan() {
  const w = ws.w, items = [];
  // ١. أضعف جانب.
  const weak = aspectRank[0], zero = WK.aspects.filter((a) => wkTasks(w, 'aspect', a).length === 0);
  if (weak) {
    const z = zero.length ? ` وفيه <span class="num">${zero.length}</span> جوانب ما اتلمسوش خالص: ${zero.slice(0, 2).map((a) => '«' + esc(a) + '»').join(' و')}${zero.length > 2 ? ' وغيرهم' : ''}.` : '';
    items.push({ t: `اديله وقت أكتر: جانب «${esc(weak.a)}»`, d: `خلص <span class="num">${weak.c.done}</span> من <span class="num">${weak.c.total}</span> بس (${PCB(weak.c.pct)})، وده أضعف جانب.${z}`, f: { kind: 'aspect', id: weak.a }, go: 'المهام' });
  }
  // ٢. الهدف الأحمر، أو الأضعف.
  const gs = WK.goals.map((g) => ({ g, s: goalStat(w, g) })).filter((x) => x.s.pct !== null).sort((a, b) => a.s.pct - b.s.pct);
  const red = gs.find((x) => verdict(x.s.pct) === 'bad');
  if (red) {
    items.push({ t: `رجّع هدف «${esc(red.g)}» على السكة`, d: `الحكم أحمر: اتعمل <span class="num">${red.s.done}</span> من <span class="num">${red.s.planned}</span>${red.s.target ? '، والمعيار ' + esc(red.s.target) : ''}. حط له ميعاد ثابت في الأسبوع.`, f: { kind: 'goal', id: red.g }, go: 'الهدف' });
  } else if (gs[0]) {
    items.push({ t: `مفيش هدف أحمر، كمّل على «${esc(gs[0].g)}»`, d: `ده أقل هدف عند ${PCB(gs[0].s.pct)} (<span class="num">${gs[0].s.done}</span> من <span class="num">${gs[0].s.planned}</span>).${gs[0].s.target ? ' المعيار ' + esc(gs[0].s.target) + '.' : ''}`, f: { kind: 'goal', id: gs[0].g }, go: 'الهدف' });
  }
  // ٣. المفتوح.
  const open = wkTasks(w, 'open'), vis = open.filter((t) => !t.hidden), hid = open.length - vis.length;
  const names = vis.slice(0, 2).map((t) => '«' + esc(t.t) + '»').join(' و');
  const more = vis.length > 2 ? ` و<span class="num">${vis.length - 2}</span> غيرهم` : '';
  const hidTxt = hid ? `${names ? '، و' : ''}<span class="num">${hid}</span> محمية` : '';
  const out = WK.weeks[w].out;
  if (open.length) items.push({ t: `رحّل <span class="num">${open.length}</span> ${TASKS_W(open.length)} لسه مفتوحة`, d: (names ? 'زي ' + names + more : '') + hidTxt + '.' + (out ? ` ودخّل <span class="num">${out}</span> حاجات لسه برّه البرنامج على TickTick.` : ''), f: { kind: 'open', id: 'open' }, go: 'المفتوح' });
  const seals = ['١.', '٢.', '٣.'];
  $w('plan').innerHTML = items.length ? items.slice(0, 3).map((it, i) =>
    `<button class="pi" data-pk="${it.f.kind}" data-pid="${esc(it.f.id)}"><span class="seal">${seals[i]}</span><span><p class="pt">${it.t}</p><p class="pd">${it.d}</p></span><span class="go">${it.go}</span></button>`).join('')
    : '<p class="note">مفيش حاجة طالعة من الأرقام الأسبوع ده.</p>';
}
function filterLabel(f) {
  if (!f) return '';
  if (f.id === NO_ASP || f.id === NO_PROJ) return `اللي ${f.id}`;
  if (f.kind === 'aspect') return `جانب «${f.id}»`;
  if (f.kind === 'project') return `مشروع «${f.id}»`;
  if (f.kind === 'goal') return `هدف «${f.id}»`;
  if (f.kind === 'open') return 'المفتوح بس';
  return '';
}
function renderTasks() {
  const f = ws.f;
  let list = f ? wkTasks(ws.w, f.kind, f.id) : wkTasks(ws.w);
  if (ws.s === 'open') list = list.filter((t) => !t.done);
  if (ws.s === 'done') list = list.filter((t) => t.done);
  const vis = list.filter((t) => !t.hidden), hid = list.filter((t) => t.hidden);
  vis.sort((a, b) => (a.done - b.done) || (a.di - b.di));
  $w('activeF').classList.toggle('on', !!f);
  $w('activeFText').textContent = filterLabel(f);
  $w('taskCount').innerHTML = `<span class="num">${list.length}</span> ${TASKS_W(list.length)}`;
  let html = '', lastDone = null;
  vis.forEach((t, i) => {
    if (t.done !== lastDone && ws.s === 'all') { html += `<li class="sep">${t.done ? 'خلصت' : 'لسه مفتوحة'}</li>`; lastDone = t.done; }
    html += `<li class="task${t.done ? ' dn' : ''}" style="animation-delay:${i * 25}ms">` +
      `<span class="chk${t.done ? ' on' : ''}">${t.done ? '<svg viewBox="0 0 12 12"><path d="M2.5 6.2 5 8.5 9.5 3.5"/></svg>' : ''}</span>` +
      `<div><p class="tt">${esc(t.t)}</p><p class="tm">${esc(t.p)} · ${esc(t.a)}</p></div><span class="dy">${t.di >= 0 ? WK_DAYS[t.di] : ''}</span></li>`;
  });
  if (hid.length) {
    const hd = hid.filter((t) => t.done).length;
    html += `<li class="task lock"><span class="chk"><span class="emo" style="font-size:11px">🔒</span></span>` +
      `<div><p class="tt">مهام محمية: <span class="num">${hid.length}</span></p><p class="tm">خلص منها <span class="num">${hd}</span> ولسه <span class="num">${hid.length - hd}</span> · العناوين ما بتظهرش هنا</p></div><span class="dy"></span></li>`;
  }
  if (!list.length) html = '<li class="empty">مفيش مهام هنا.</li>';
  $w('tasks').innerHTML = html;
  $w('tgl').textContent = $w('taskCard').classList.contains('closed') ? `اعرض المهام (${list.length})` : 'اقفل المهام';
}
const animateBars = (root) => later(() => root.querySelectorAll('.wk .bar i').forEach((el) => { el.style.width = el.dataset.w + '%'; }));
function wkRenderAll() {
  renderSeg(); renderHero(); renderDays(); renderAspects(); renderProjects(); renderGoals(); renderPlan(); renderTasks();
  animateBars(app);
}
function renderFilterParts() {
  renderAspects(); renderProjects(); renderDays(); renderTasks();
  if (ws.f) $w('taskCard').classList.remove('closed');
  renderTasks();
  app.querySelectorAll('.wk .bar i').forEach((el) => { el.style.width = el.dataset.w + '%'; });
}
function setFilter(f, scroll) {
  const same = ws.f && f && ws.f.kind === f.kind && ws.f.id === f.id;
  ws.f = same ? null : f;
  if (ws.f && ws.f.kind === 'open') { ws.s = 'all'; syncChips(); }
  renderFilterParts();
  if (scroll && ws.f) $w('taskCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
const syncChips = () => [...$w('stChips').children].forEach((b) => b.setAttribute('aria-pressed', b.dataset.s === ws.s));
app.addEventListener('click', (e) => {
  if (S.view !== 'week' || !WK || !e.target.closest('.wk')) return;
  let b;
  if ((b = e.target.closest('#weekSeg [data-w]'))) { ws.w = Number(b.dataset.w); ws.f = null; ws.openGoal = null; wkRenderAll(); return; }
  if ((b = e.target.closest('.row, .rl'))) { setFilter({ kind: b.dataset.k, id: b.dataset.id }, false); return; }
  if ((b = e.target.closest('.pi'))) {
    const k = b.dataset.pk, id = b.dataset.pid;
    if (k === 'goal') { ws.openGoal = id; renderGoals(); }
    ws.f = null; setFilter({ kind: k, id }, true); return;
  }
  if ((b = e.target.closest('.goal'))) {
    const g = b.dataset.g; ws.openGoal = ws.openGoal === g ? null : g;
    app.querySelectorAll('.goal').forEach((x) => x.setAttribute('aria-expanded', x.dataset.g === ws.openGoal));
    return;
  }
  if ((b = e.target.closest('#stChips button'))) { ws.s = b.dataset.s; syncChips(); renderTasks(); return; }
  if (e.target.closest('#tgl')) { $w('taskCard').classList.toggle('closed'); renderTasks(); return; }
  if (e.target.closest('#clearF')) { ws.f = null; renderFilterParts(); }

async function post(body) {
  const r = await fetch(API, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ initData: tg.initData, ...body }) });
  if (r.status === 401 || r.status === 403) throw Object.assign(new Error('مش مسموح. اقفل اللوحة وافتحها تاني من زرار البوت.'), { shown: true });
  if (!r.ok) throw Object.assign(new Error(`في عطل في السيرفر (${r.status}). جرّب تاني بعد شوية.`), { shown: true });
  return r.json();
}
// كل شاشة بتترسم من رد واحد بس، فالأرقام اللي فيها من نفس اللحظة. والرد بيتصدّق لمدة دقيقتين.
const FRESH_MS = 120000;
const okMonth = (m) => m && /^\d{4}-\d{2}$/.test(m.month);
function useMeta(d) {
  months = Array.isArray(d.months) ? d.months.filter(okMonth) : [];
  budget = Number(d.budget) || 0;
  catBudgets = Array.isArray(d.cat_budgets) ? d.cat_budgets : [];
  cancelled = Array.isArray(d.cancelled) ? d.cancelled : [];
  accounts = d.accounts || null;
}
async function getData(period) {
  const c = cache[period];
  if (c && Date.now() - c.at <= FRESH_MS) return c.d;
  const g = cacheGen, d = await post({ period });
  if (g === cacheGen) cache[period] = { at: Date.now(), d };
  return d;
}
async function show() {
  document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.v === S.view));
  backBtn();
  if (!tg || !tg.initData) { app.innerHTML = '<div class="msg">افتح اللوحة من زرار البوت في تليجرام.</div>'; return; }
  const my = ++seq;
  app.innerHTML = '<div class="msg">بيحمّل…</div>';
  try {
    if (S.view === 'commands') {
      const d = await post({ view: 'commands' });
      if (my === seq) renderCommands(d.commands || []);
      return;
    }
    // الأسبوع فرع لوحده: رده مالوش دعوة بأرقام الفلوس، وبيتصدّق دقيقتين زيها.
    // ومفتاحه في الكاش «view:week»، لأن «week» مفتاح «آخر 7 أيام» في الفلوس (كانوا بيدوسوا على بعض، 2026-11-06).
    if (S.view === 'week') {
      const c = cache['view:week'];
      if (!c || Date.now() - c.at > FRESH_MS) cache['view:week'] = { at: Date.now(), d: await post({ view: 'week' }) };
      if (my === seq) renderWeek(cache['view:week'].d.week);
      return;
    }
    const d = await getData(S.view === 'reports' ? 'month' : S.period);
    if (my !== seq) return;
    useMeta(d);
    byId = {};
    if (S.view === 'reports') renderReports(d);
    else if (S.view === 'stats') S.cat ? renderCat(d) : renderStats(d);
    else renderTx(d);
  } catch (e) {
    if (my === seq) app.innerHTML = `<div class="msg">${esc(e.shown ? e.message : 'في عطل في الاتصال. جرّب تاني.')}</div>`;
  }
}

app.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const v = t.dataset.v;
  switch (t.dataset.act) {
    case 'period': S.period = v; S.cat = null; return show();
    case 'kind': S.kind = v; S.cat = null; return show();
    case 'mode': S.mode = v; return show();
    case 'sort': S.sort = v; return show();
    case 'cat': S.group = false; S.cat = v; S.catColor = t.dataset.c; S.sort = 'date'; window.scrollTo(0, 0); return show();
    // من كارت ميزانية تصنيف في التقارير: صفحة التصنيف نفسها في الإحصائيات، على الشهر ده.
    case 'bcat': S.group = v === OTHER; S.view = 'stats'; S.kind = 'expense'; S.period = 'month'; S.cat = v; S.catColor = t.dataset.c; S.sort = 'date'; window.scrollTo(0, 0); return show();
    case 'back': return goBack();
    case 'sec':
      open[v] = !open[v];
      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
      return show();
    case 'item': return openItem(v);
    case 'day': return openDay(v);
    case 'page': return app.querySelector('.pager').children[Number(v)].scrollIntoView({ inline: 'start', block: 'nearest', behavior: 'smooth' });
    case 'month': {
      const cur = curMonth();
      S.view = 'tx'; S.cat = null; S.period = v === cur ? 'month' : v === prevMonth(cur) ? 'last_month' : v;
      return show();
    }
  }
});
sheet.addEventListener('click', (e) => {
  if (e.target === sheet) return closeSheet();
  const t = e.target.closest('[data-act]'); if (!t) return;
  const v = t.dataset.v;
  switch (t.dataset.act) {
    case 'close': return closeSheet();
    case 'item': return openItem(v);
    case 'pickcat': return pickCategory(v);
    case 'setcat': return doWrite({ action: 'category', id: Number(v), category: t.dataset.c });
    // الإلغاء بدوستين: الأولى بتقلب الزرار «اضغط تاني للتأكيد»، والتانية بتلغي.
    // والتانية ما بتتحسبش لو جت قبل نص ثانية، عشان اللمسة المزدوجة ما تلغيش من غير قصد.
    case 'cancel1': t.dataset.act = 'cancel2'; t.dataset.at = Date.now(); t.className = 'sure'; t.textContent = 'اضغط تاني للتأكيد'; return;
    case 'cancel2': if (Date.now() - Number(t.dataset.at) < 500) return; return doWrite({ action: 'cancel', id: Number(v) });
    // مهمة ٢٣: الترجيع كتابة زي الإلغاء، فبدوستين وبنفس مهلة نص الثانية.
    case 'restore': t.dataset.act = 'restore2'; t.dataset.at = Date.now(); t.className = 'sure'; t.textContent = 'اضغط تاني للتأكيد'; return;
    case 'restore2': if (Date.now() - Number(t.dataset.at) < 500) return; return doWrite({ action: 'restore', id: Number(v) });
  }
});
if (tg && tg.BackButton) tg.BackButton.onClick(goBack);
document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => { S.view = b.dataset.v; S.cat = null; open.accounts = false; closeSheet(); show(); }));
const startTab = new URLSearchParams(location.search).get('tab');
if (['tx', 'stats', 'reports', 'week'].includes(startTab)) S.view = startTab;
show();
