<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة الفلوس</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg:#f6f4f8; --card:#fff; --ink:#1d1b20; --muted:#6b6670; --accent:#d6336c; --line:#ece8ef; --red:#e03131; --green:#2f9e44; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151316; --card:#211e23; --ink:#f2eff4; --muted:#a59fa9; --line:#2f2b31; --red:#ff6b6b; --green:#51cf66; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,"Segoe UI",Tahoma,sans-serif; }
  header { background:var(--accent); color:#fff; padding:16px 16px 12px; }
  header h1 { margin:0 0 10px; font-size:18px; }
  .tabs { display:flex; gap:6px; }
  .tabs button { flex:1; min-width:0; border:0; border-radius:10px; padding:6px 2px; background:rgba(255,255,255,.2); color:#fff; font-size:12px; white-space:nowrap; }
  /* 5 تبويبات من موجة ٤: الأيقونة فوق والاسم تحتها، زي شريط التطبيق. */
  .tabs button i { display:block; font-style:normal; font-size:17px; line-height:1.3; }
  .tabs button.on { background:#fff; color:var(--accent); font-weight:700; }
  main { padding:12px 16px 32px; }
  .card { background:var(--card); border-radius:16px; padding:14px; margin-bottom:12px; }
  .kpis { display:flex; gap:8px; }
  .kpi { flex:1; text-align:center; }
  .kpi b { display:block; font-size:20px; }
  .kpi span { color:var(--muted); font-size:12px; }
  .kpi b, .item b, .day h3 span, .ltr { direction:ltr; unicode-bidi:isolate; }
  .donut { display:flex; align-items:center; gap:14px; }
  .donut svg { width:140px; height:140px; flex:none; }
  .legend { flex:1; font-size:13px; }
  .legend div { display:flex; align-items:center; gap:8px; margin:4px 0; }
  .legend b { color:var(--muted); font-weight:600; direction:ltr; unicode-bidi:isolate; }
  .daily { text-align:center; color:var(--muted); font-size:13px; margin:-4px 0 12px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-left:6px; }
  .bar { margin:10px 0; }
  .bar .row { display:flex; justify-content:space-between; font-size:14px; }
  .bar .track { height:6px; background:var(--line); border-radius:3px; margin-top:4px; }
  .bar .fill { height:6px; border-radius:3px; }
  .day h3 { font-size:13px; color:var(--muted); margin:14px 0 6px; display:flex; justify-content:space-between; }
  .item { display:flex; justify-content:space-between; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .item small { color:var(--muted); display:block; }
  .msg { text-align:center; color:var(--muted); padding:40px 0; }
  .tap { cursor:pointer; }
  /* شريط الفترات والزراير المقسومة، زي التطبيق في فيديو مصطفى (موجة ١، 2026-10-29). */
  .chips { display:flex; gap:6px; overflow-x:auto; margin:0 -16px 12px; padding:0 16px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chips button { flex:none; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:999px; padding:6px 14px; font-size:13px; }
  .chips button.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .seg { display:flex; background:var(--line); border-radius:10px; padding:3px; margin-bottom:12px; }
  .seg button { flex:1; border:0; background:none; color:var(--muted); padding:7px; border-radius:8px; font-size:14px; }
  .seg button.on { background:var(--card); color:var(--ink); font-weight:700; }
  /* التقويم: كل يوم بلون صرفه أو دخله، وأول عمود من اليمين الأحد. */
  .cal { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal .hd { text-align:center; font-size:11px; color:var(--muted); padding-bottom:4px; }
  .cd { min-height:52px; border-radius:8px; padding:4px 2px; text-align:center; font-size:12px; background:var(--bg); }
  .cd b { display:block; font-size:13px; }
  .cd small { display:block; font-size:10px; direction:ltr; }
  .cd.out { background:color-mix(in srgb, var(--red) 16%, transparent); color:var(--red); }
  .cd.in { background:color-mix(in srgb, var(--green) 16%, transparent); color:var(--green); }
  .cd .g { color:var(--green); }
  .cd.off { opacity:.35; }
  .cd.blank { background:none; }
  .note { text-align:center; color:var(--muted); font-size:13px; margin-top:10px; }
  .note b { color:var(--ink); direction:ltr; unicode-bidi:isolate; }
  /* الدايرة بتتسحب 3 صفحات، والنقط تحتها بتقول إنت فين. */
  .pager { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; }
  .pager::-webkit-scrollbar { display:none; }
  .page { flex:0 0 100%; scroll-snap-align:start; min-height:150px; }
  .dots { display:flex; justify-content:center; gap:6px; margin-top:8px; }
  .dots i { width:7px; height:7px; border-radius:50%; background:var(--line); }
  .dots i.on { background:var(--muted); }
  svg.line { width:100%; height:130px; display:block; }
  .sum { display:flex; justify-content:space-between; font-size:13px; color:var(--muted); margin-top:6px; }
  .sum b { color:var(--ink); direction:ltr; unicode-bidi:isolate; }
  .back { display:flex; align-items:center; gap:10px; font-size:17px; font-weight:700; margin-bottom:12px; }
  .back span { font-size:20px; }
  .mrow { display:grid; grid-template-columns:1.2fr 1fr 1fr 1fr; gap:6px; padding:9px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .mrow b { text-align:left; direction:ltr; unicode-bidi:isolate; font-weight:600; }
  .mrow.th { color:var(--muted); font-size:12px; }
  .mrow.th span:not(:first-child) { text-align:left; }
  .yr { color:var(--muted); font-size:12px; margin-top:12px; }
  .neg { color:var(--red); } .pos { color:var(--green); }
  /* شباك التفاصيل من تحت: بيتفتح بدوسة على أي حركة أو يوم. */
  .sheet { position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; align-items:flex-end; z-index:5; }
  .sheet.on { display:flex; }
  .sh { background:var(--card); width:100%; border-radius:18px 18px 0 0; padding:18px 16px 24px; max-height:80vh; overflow:auto; }
  .shhd { text-align:center; font-size:30px; margin-bottom:4px; }
  .shhd b { display:block; font-size:17px; }
  .kv { display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .kv span { color:var(--muted); flex:none; }
  .kv b { text-align:left; font-weight:600; }
  .sh .close { width:100%; margin-top:14px; border:0; border-radius:12px; padding:11px; background:var(--accent); color:#fff; font-size:15px; }
  .stat { flex:1; text-align:center; border-radius:12px; padding:10px; background:var(--card); }
  .stat b { display:block; font-size:24px; color:var(--st); }
  .stat span { font-size:12px; color:var(--st); }
  .cmd { padding:12px 14px; cursor:pointer; }
  .cmd .row { display:flex; align-items:center; gap:10px; }
  .cmd .ic { font-size:22px; flex:none; }
  .cmd .tt { flex:1; min-width:0; }
  .cmd .tt b { display:block; font-size:15px; }
  .cmd .tt small { display:block; color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cmd .ago { font-size:12px; color:var(--muted); flex:none; }
  .cmd .next { margin-top:8px; padding:6px 10px; border-radius:10px; background:var(--line); font-size:13px; }
  .cmd .more { display:none; margin-top:8px; padding-top:8px; border-top:1px solid var(--line); font-size:12px; color:var(--muted); line-height:1.7; }
  .cmd.open .more { display:block; }
  .done { --st:#2f9e44; } .waiting, .pulled { --st:#f08c00; }
  .stat { cursor:pointer; border:2px solid transparent; }
  .stat.on { border-color:var(--st); }
  /* ميزانية الشهر (موجة ٢): دايرة زي التطبيق، وشرطة بتقول الشهر وصل لفين النهارده. */
  .bud { display:flex; align-items:center; gap:14px; }
  .bud svg { width:112px; height:112px; flex:none; }
  .bud .kvs { flex:1; }
  .bud .kv { padding:6px 0; }
  .bud-t { margin:0 0 10px; font-size:15px; }
  .pace { font-size:13px; color:var(--muted); margin-top:10px; padding-top:10px; border-top:1px solid var(--line); text-align:center; }
  .pace b { color:var(--ink); direction:ltr; unicode-bidi:isolate; }
  /* ميزانية كل تصنيف: كارت صغير لكل واحد، اتنين جنب بعض، ودوسة بتفتح صفحة التصنيف. */
  .cbs { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .cb { display:flex; align-items:center; gap:8px; background:var(--bg); border-radius:12px; padding:8px; min-width:0; }
  .cb svg { width:58px; height:58px; flex:none; }
  .cb div { min-width:0; }
  .cb b { display:block; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cb small { display:block; font-size:11px; color:var(--muted); }
  .cb small span { direction:ltr; unicode-bidi:isolate; }
  /* موجة ٣: زراير التعديل في شباك الحركة، واللي اتلغى بيبان باهت ومشطوب. */
  .acts { display:flex; gap:8px; margin-top:14px; }
  .acts button { flex:1; border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:12px; padding:11px 6px; font-size:14px; }
  .acts button.warn { color:var(--red); border-color:color-mix(in srgb, var(--red) 40%, transparent); }
  .acts button.sure { background:var(--red); color:#fff; border-color:var(--red); }
  .lock { margin-top:14px; padding:10px 12px; border-radius:12px; background:var(--bg); color:var(--muted); font-size:13px; line-height:1.6; }
  .cats { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:6px; }
  .cats button { border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:12px; padding:11px 6px; font-size:14px; }
  .cats button.on { border-color:var(--accent); color:var(--accent); font-weight:700; }
  .toast { text-align:center; padding:14px 0 4px; font-size:15px; }
  .item.cx { opacity:.55; }
  .item.cx b { text-decoration:line-through; }
  /* موجة ٤ (#60): حسابين زي التطبيق، والأرقام «••••» لحد ما مصطفى يدوس. */
  .acc-top { text-align:center; padding:18px 14px; cursor:pointer; }
  .acc-top span { color:var(--muted); font-size:13px; }
  .acc-top b { display:block; font-size:30px; margin:6px 0; }
  .acc-top small { color:var(--muted); font-size:12px; }
  .acc-h { display:flex; justify-content:space-between; font-size:13px; color:var(--muted); padding-bottom:8px; border-bottom:1px solid var(--line); }
  .acc-h b { color:var(--ink); }
  .acc { display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .acc:last-child { border-bottom:0; }
  .acc .ic { font-size:24px; flex:none; }
  .acc div { flex:1; min-width:0; }
  .acc div b { display:block; font-size:15px; }
  .acc small { color:var(--muted); font-size:12px; }
  .acc > b { font-size:16px; }
</style>
</head>
<body>
<header>
  <h1>💸 لوحة الفلوس</h1>
  <div class="tabs">
    <button data-v="tx" class="on"><i>🧾</i>المعاملات</button>
    <button data-v="stats"><i>📊</i>الإحصائيات</button>
    <button data-v="accounts"><i>🏦</i>الحسابات</button>
    <button data-v="reports"><i>📑</i>التقارير</button>
    <button data-v="commands"><i>📋</i>الأوامر</button>
  </div>
</header>
<main id="app"><div class="msg">بيحمّل…</div></main>
<div id="sheet" class="sheet"></div>
<script>
const API = 'https://rsvsuwwzlhnxghyqfyzk.supabase.co/functions/v1/bayt-panel-data';
const WRITE = 'https://rsvsuwwzlhnxghyqfyzk.supabase.co/functions/v1/bayt-panel-write';
const COLORS = ['#d6336c','#f59f00','#37b24d','#1c7ed6','#7048e8','#0ca678','#e8590c','#868e96'];
// أيقونة لكل تصنيف، نفس أيقونات ملخص الساعة 10. وتصنيف ليه لون ثابت، والباقي بياخد لون من القايمة بالترتيب.
const ICON = { 'أكل':'🍔', 'إلكترونيات':'🖥️', 'اشتراكات':'📱', 'رسوم وعمولات':'🏦', 'بيت وفواتير':'🏠', 'عربية وبنزين':'🚗',
  'قسط الشقة':'🏢', 'أهل':'👨‍👩‍👧', 'شغل':'💼', 'صحة':'💊', 'ملابس':'👕', 'أخرى':'📦', 'دخل ATM':'💹' };
const STYLE = { 'إلكترونيات': { color: '#9b8cf2' } };
const color = (c, i) => (STYLE[c] && STYLE[c].color) || COLORS[i % COLORS.length];
const label = (c) => (ICON[c] ? ICON[c] + ' ' : '') + esc(c);
const MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const monthName = (ym) => `${MONTHS[Number(ym.slice(5, 7)) - 1]} ${ym.slice(0, 4)}`;
const dayName = (iso) => `${Number(iso.slice(8, 10))} ${MONTHS[Number(iso.slice(5, 7)) - 1]}`;
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const app = document.getElementById('app');
const sheet = document.getElementById('sheet');
const fmt = (n) => Number(n).toLocaleString('en-US', { maximumFractionDigits: 2 });
// علامة سالب واحدة في اللوحة كلها: «−».
const signed = (n) => (Number(n) < 0 ? '−' : '') + fmt(Math.abs(Number(n)));
function daily(l) {
  if (!l || !l.day) return '';
  const day = `<span class="ltr">${esc(l.day)}</span>`;
  if (l.status !== 'sent') return `<div class="daily">⚠️ ملخص يوم ${day} ما اتبعتش</div>`;
  const t = new Date(l.sent_at).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Dubai' });
  return `<div class="daily">🌙 آخر ملخص: يوم ${day}، اتبعت الساعة <span class="ltr">${t}</span></div>`;
}
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const SRC = { email_alhilal: '📧 الهلال', bot_manual: '🤖 البوت', atm_cycle: '💹 ATM' };
const KIND = { expense: 'نفقة', income: 'دخل', refund: 'مرتجع' };
function donut(cats, total) {
  if (!total) return '';
  let a = 0, paths = '';
  cats.forEach((c, i) => {
    const f = Math.max(0, c.total) / total; if (!f) return;
    const a2 = a + f * 2 * Math.PI, large = f > 0.5 ? 1 : 0;
    const p = (t) => [70 + 60 * Math.sin(t), 70 - 60 * Math.cos(t)];
    const [x1, y1] = p(a), [x2, y2] = p(a2 - 1e-6);
    paths += `<path d="M${x1} ${y1} A60 60 0 ${large} 1 ${x2} ${y2}" stroke="${color(c.category, i)}" stroke-width="20" fill="none"/>`;
    a = a2;
  });
  return `<svg viewBox="0 0 140 140">${paths}<text x="70" y="76" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">${fmt(total)}</text></svg>`;
}

// الحالة كلها في مكان واحد: التبويب، والفترة، ونفقات ولا دخل، وقايمة ولا تقويم، والتصنيف المفتوح.
const S = { view: 'tx', period: 'month', kind: 'expense', mode: 'list', cat: null, catColor: '', sort: 'date', page: 0 };
const cache = {};
let months = [], byId = {}, seq = 0, budget = 0, catBudgets = [], cancelled = [], accounts = null, showBal = false;
const dubaiToday = () => new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Dubai' });
const curMonth = () => dubaiToday().slice(0, 7);
function prevMonth(ym) { const [y, m] = ym.split('-').map(Number); return m === 1 ? `${y - 1}-12` : `${y}-${String(m - 1).padStart(2, '0')}`; }
const val = (i) => (i.kind === 'refund' ? -Number(i.amount) : Number(i.amount));
const isKind = (i) => (S.kind === 'income' ? i.kind === 'income' : i.kind !== 'income');
function flat(d) {
  const all = (d.days || []).flatMap((x) => x.items.map((it) => ({ ...it, day: x.day })));
  all.forEach((it) => { byId[it.id] = it; });
  return all;
}
function dates(from, to) {
  const out = [];
  for (let t = Date.parse(from + 'T00:00:00Z'); t <= Date.parse(to + 'T00:00:00Z'); t += 864e5) out.push(new Date(t).toISOString().slice(0, 10));
  return out;
}

function chips() {
  const cur = curMonth(), last = prevMonth(cur);
  const list = [['week', 'آخر 7 أيام'], ['month', 'الشهر ده'], ['last_month', 'الشهر اللي فات']]
    .concat(months.map((m) => m.month).filter((m) => m < last).map((m) => [m, monthName(m)]));
  return `<div class="chips">${list.map(([p, t]) => `<button data-act="period" data-v="${p}" class="${S.period === p ? 'on' : ''}">${t}</button>`).join('')}</div>`;
}
const seg = (act, opts, on) => `<div class="seg">${opts.map(([v, t]) => `<button data-act="${act}" data-v="${v}" class="${on === v ? 'on' : ''}">${t}</button>`).join('')}</div>`;
function kpis(x, i) {
  return `<div class="card kpis">
    <div class="kpi"><b>${fmt(x)}</b><span>نفقات (درهم)</span></div>
    <div class="kpi"><b>${fmt(i)}</b><span>دخل (درهم)</span></div>
    <div class="kpi"><b>${signed(i - x)}</b><span>الفرق</span></div></div>`;
}
// 💰 كارت الميزانية: الرقم جاي من الباب مش من الصفحة، لأن الصفحة نفسها على GitHub مكشوفة.
// الدايرة أخضر لو الصرف ماشي أبطأ من الشهر، وبرتقاني لو أسرع، وأحمر لو عدّى الميزانية.
function budgetState(spent, amount, ym) {
  const days = new Date(Date.UTC(Number(ym.slice(0, 4)), Number(ym.slice(5, 7)), 0)).getUTCDate();
  const isCur = ym === curMonth(), today = isCur ? Number(dubaiToday().slice(8, 10)) : days;
  const f = spent / amount, over = spent > amount;
  const col = over ? 'var(--red)' : f > today / days ? '#f08c00' : 'var(--green)';
  return { f, over, left: amount - spent, col, isCur, today, days, rest: days - today + 1 };
}
function ring(st, sub) {
  const R = 46, C = 2 * Math.PI * R, t = (st.today / st.days) * 2 * Math.PI;
  const tick = st.isCur ? `<line x1="${56 + 36 * Math.sin(t)}" y1="${56 - 36 * Math.cos(t)}" x2="${56 + 56 * Math.sin(t)}" y2="${56 - 56 * Math.cos(t)}" stroke="var(--ink)" stroke-width="2.5"/>` : '';
  return `<svg viewBox="0 0 112 112"><circle cx="56" cy="56" r="${R}" stroke="var(--line)" stroke-width="11" fill="none"/>
    <circle cx="56" cy="56" r="${R}" stroke="${st.col}" stroke-width="11" fill="none" stroke-linecap="round" stroke-dasharray="${(Math.min(st.f, 1) * C).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 56 56)"/>${tick}
    <text x="56" y="${sub ? 58 : 63}" text-anchor="middle" font-size="${sub ? 18 : 24}" font-weight="700" fill="${st.col}">${Math.round(st.f * 100)}%</text>` +
    (sub ? `<text x="56" y="75" text-anchor="middle" font-size="11" fill="var(--muted)">${st.over ? 'اتجاوزت' : 'اتصرف'}</text>` : '') + `</svg>`;
}
function budgetCard(spent, ym, amount = budget, title = `💰 ميزانية ${ym && monthName(ym)}`) {
  if (!amount || !ym) return '';
  const st = budgetState(spent, amount, ym), left = st.left;
  const kv = (k, v, c) => `<div class="kv"><span>${k}</span><b class="${c || ''}">${v}</b></div>`;
  const pace = st.over ? `⚠️ عدّيت الميزانية بـ <b>${fmt(-left)}</b> درهم`
    : st.isCur ? `⏱️ فاضل <b>${st.rest}</b> يوم في الشهر · تقدر تصرف <b>${fmt(left / st.rest)}</b> في اليوم` : `✅ الشهر خلص وإنت جوّه الميزانية`;
  const svg = ring(st, true), over = st.over;
  return `<div class="card"><h4 class="bud-t">${title}</h4><div class="bud">${svg}<div class="kvs">` +
    kv('الميزانية', fmt(amount)) + kv('اتصرف', fmt(spent)) + kv(over ? 'اتجاوزت' : 'فاضل', signed(left), left < 0 ? 'neg' : 'pos') +
    `</div></div><div class="pace">${pace}</div></div>`;
}
// كروت ميزانية التصنيفات: الصرف من by_category بتاع نفس الشهر، وتصنيف ما اتصرفش فيه بيبان 0%.
function catBudgetsCard(d, ym) {
  if (!catBudgets.length || !ym) return '';
  const spent = {}, idx = {};
  (d.by_category || []).forEach((c, i) => { spent[c.category] = Number(c.total); idx[c.category] = i; });
  return `<div class="card"><h4 class="bud-t">🗂️ ميزانية التصنيفات</h4><div class="cbs">` + catBudgets.map((b) => {
    const s = spent[b.category] || 0, st = budgetState(s, Number(b.amount), ym);
    return `<div class="cb tap" data-act="bcat" data-v="${esc(b.category)}" data-c="${color(b.category, idx[b.category] ?? 0)}">${ring(st, false)}
      <div><b>${label(b.category)}</b><small><span>${fmt(s)}</span> من <span>${fmt(b.amount)}</span></small>` +
      `<small class="${st.over ? 'neg' : 'pos'}">${st.over ? 'اتجاوزت' : 'فاضل'} <span>${fmt(Math.abs(st.left))}</span></small></div></div>`;
  }).join('') + `</div></div>`;
}
const periodMonth = () => (S.period === 'month' ? curMonth() : S.period === 'last_month' ? prevMonth(curMonth()) : /^\d{4}-\d{2}$/.test(S.period) ? S.period : '');
const itemRow = (it, extra) => `<div class="item tap" data-act="item" data-v="${it.id}"><div>${esc(it.note || it.category)}<small>${label(it.category)} · ${extra}</small></div><b>${it.kind === 'income' ? '+' : '−'}${fmt(it.amount)}</b></div>`;

// خط كل يوم: أول يوم على اليمين زي التطبيق، والنقطة الملوّنة يوم فيه حركة.
function line(pts, col) {
  const W = 300, H = 130, P = 12, n = pts.length, max = Math.max(1, ...pts.map((p) => p.v));
  const x = (i) => (n < 2 ? W / 2 : W - P - i * (W - 2 * P) / (n - 1));
  const y = (v) => H - 20 - (v / max) * (H - 38);
  const poly = pts.map((p, i) => `${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const dotsSvg = pts.map((p, i) => p.v > 0
    ? `<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3.5" fill="${col}"/>`
    : `<circle cx="${x(i).toFixed(1)}" cy="${y(0).toFixed(1)}" r="1.6" fill="var(--muted)"/>`).join('');
  const lab = (i) => `<text x="${x(i).toFixed(1)}" y="${H - 4}" text-anchor="middle" font-size="10" fill="var(--muted)">${Number(pts[i].day.slice(8, 10))}</text>`;
  return `<svg class="line" viewBox="0 0 ${W} ${H}">
    <line x1="${P}" x2="${W - P}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>
    <polyline points="${poly}" fill="none" stroke="${col}" stroke-width="1.5" opacity=".55"/>${dotsSvg}
    ${lab(0)}${n > 2 ? lab(Math.floor((n - 1) / 2)) : ''}${n > 1 ? lab(n - 1) : ''}
    <text x="${P}" y="12" font-size="10" fill="var(--muted)">${fmt(max)}</text></svg>`;
}
function series(d, pred) {
  const m = {};
  flat(d).filter(pred).forEach((i) => { m[i.day] = (m[i.day] || 0) + val(i); });
  return dates(d.from, d.to).map((day) => ({ day, v: m[day] || 0 }));
}
const sumAvg = (pts) => {
  const t = pts.reduce((a, p) => a + p.v, 0);
  return `<div class="sum"><span>المجموع: <b>${fmt(t)}</b></span><span>المعدل في اليوم: <b>${fmt(pts.length ? t / pts.length : 0)}</b></span></div>`;
};

// 🧾 المعاملات: الأرقام التلاتة، وبعدها قايمة بالأيام أو تقويم الشهر.
function renderTx(d) {
  const all = flat(d);
  let h = chips() + kpis(d.total_expense, d.total_income) + budgetCard(Number(d.total_expense), periodMonth()) + daily(d.last_daily) + seg('mode', [['list', '📃 قايمة'], ['cal', '📅 تقويم']], S.mode);
  if (!all.length) return app.innerHTML = h + '<div class="msg">مفيش حركات في الفترة دي.</div>';
  if (S.mode === 'cal') return app.innerHTML = h + calendar(d, all);
  h += `<div class="card">` + (d.days || []).map((day) => `<div class="day"><h3><span>${esc(day.day)}</span><span>${signed(day.total)}</span></h3>` +
    day.items.map((it) => itemRow(it, `${SRC[it.source] || ''} · ${esc(it.time)}`)).join('') + `</div>`).join('') + `</div>`;
  // اللي اتلغى من اللوحة في الفترة دي: باهت ومشطوب، وبرّه كل الأرقام، ودوسة عليه بتفتح زرار «رجّع».
  const cx = cancelled.filter((c) => c.day >= d.from && c.day <= d.to);
  cx.forEach((c) => { byId[c.id] = { ...c, cancelled: true }; });
  if (cx.length) h += `<div class="card"><div class="day"><h3><span>❌ اتلغت من اللوحة</span><span>${cx.length}</span></h3>` +
    cx.map((c) => itemRow(c, `${dayName(c.day)} · ${esc(c.time)}`).replace('class="item tap"', 'class="item tap cx"')).join('') + `</div></div>`;
  app.innerHTML = h;
}
function calendar(d, all) {
  const spend = {}, inc = {};
  all.forEach((i) => { if (i.kind === 'income') inc[i.day] = (inc[i.day] || 0) + Number(i.amount); else spend[i.day] = (spend[i.day] || 0) + val(i); });
  const week = S.period === 'week';
  const first = week ? d.from : d.from.slice(0, 8) + '01';
  const y = Number(d.from.slice(0, 4)), m = Number(d.from.slice(5, 7));
  const last = week ? d.to : new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10);
  const pad = new Date(first + 'T00:00:00Z').getUTCDay();
  const heads = ['أحد', 'اتنين', 'تلات', 'أربع', 'خميس', 'جمعة', 'سبت'].map((t) => `<div class="hd">${t}</div>`).join('');
  const cells = '<div class="cd blank"></div>'.repeat(pad) + dates(first, last).map((day) => {
    const s = spend[day] || 0, n = inc[day] || 0, inside = day >= d.from && day <= d.to;
    const cls = s > 0 ? 'out' : n > 0 ? 'in' : '';
    return `<div class="cd ${cls}${inside ? '' : ' off'}${s || n ? ' tap' : ''}" ${s || n ? `data-act="day" data-v="${day}"` : ''}><b>${Number(day.slice(8, 10))}</b>` +
      (s ? `<small>${fmt(s)}</small>` : '') + (n ? `<small class="g">+${fmt(n)}</small>` : '') + `</div>`;
  }).join('');
  const days = dates(d.from, d.to).length;
  return `<div class="card"><div class="cal">${heads}${cells}</div>
    <div class="note">متوسط الصرف في اليوم: <b>${fmt(d.total_expense / days)}</b> درهم</div>
    <div class="note"><i class="dot" style="background:var(--red)"></i>يوم فيه صرف &nbsp; <i class="dot" style="background:var(--green)"></i>يوم فيه دخل بس</div></div>`;
}

// 📊 الإحصائيات: نفقات ولا دخل، والدايرة 3 صفحات، وكل تصنيف بيفتح صفحته.
function catsOf(d) {
  if (S.kind === 'expense') return d.by_category || [];
  const g = {};
  flat(d).filter((i) => i.kind === 'income').forEach((i) => { g[i.category] = g[i.category] || { category: i.category, total: 0, count: 0 }; g[i.category].total += Number(i.amount); g[i.category].count++; });
  return Object.values(g).sort((a, b) => b.total - a.total);
}
function renderStats(d) {
  const cats = catsOf(d), total = cats.reduce((a, c) => a + Number(c.total), 0);
  let h = chips() + seg('kind', [['expense', '💸 نفقات'], ['income', '💰 دخل']], S.kind);
  if (!cats.length) return app.innerHTML = h + `<div class="msg">مفيش ${S.kind === 'income' ? 'دخل' : 'نفقات'} في الفترة دي.</div>`;
  const perDay = {};
  flat(d).filter(isKind).forEach((i) => { perDay[i.day] = (perDay[i.day] || 0) + val(i); });

  const topCats = top.slice(0, 5).map(([day, v]) => ({ category: day, total: v }));

  const col = S.kind === 'income' ? '#2f9e44' : '#d6336c';

      cats.map((c, i) => `<div><span><i class="dot" style="background:${color(c.category, i)}"></i>${label(c.category)}</span><b>${Math.round(c.total / total * 100)}%</b></div>`).join('') + `</div></div>
    <div class="page donut">${donut(topCats, total)}<div class="legend"><div><small style="color:var(--muted)">أكبر الأيام</small></div>` +
      topCats.map((c, i) => `<div><span><i class="dot" style="background:${color(c.category, i)}"></i>${c.category === 'أخرى' ? 'أيام تانية' : dayName(c.category)}</span><b>${fmt(c.total)}</b></div>`).join('') + `</div></div>
    <div class="page">${line(pts, col)}${sumAvg(pts)}</div>
  </div><div class="dots">${[0, 1, 2].map((i) => `<i data-act="page" data-v="${i}" class="tap${S.page === i ? ' on' : ''}"></i>`).join('')}</div></div>`;
  h += `<div class="card">` + cats.map((c, i) => `<div class="bar tap" data-act="cat" data-v="${esc(c.category)}" data-c="${color(c.category, i)}">
      <div class="row"><span>${label(c.category)} <small>(${c.count})</small></span><b>${fmt(c.total)}</b></div>
      <div class="track"><div class="fill" style="width:${Math.max(2, c.total / total * 100)}%;background:${color(c.category, i)}"></div></div></div>`).join('') + `</div>`;
  app.innerHTML = h;
  const pager = app.querySelector('.pager');
  if (S.page) pager.children[S.page].scrollIntoView({ inline: 'start', block: 'nearest' });
  pager.addEventListener('scroll', () => {
    const p = Math.round(Math.abs(pager.scrollLeft) / pager.clientWidth);
    if (p === S.page) return;
    S.page = p;
    app.querySelectorAll('.dots i').forEach((el, i) => el.classList.toggle('on', i === p));
  }, { passive: true });
}
function renderCat(d) {
  const pred = (i) => isKind(i) && i.category === S.cat;

}

// 📑 التقارير: الشهر ده في كارت، وتحته جدول كل الشهور. دوسة على شهر تفتح معاملاته.

// شباك التفاصيل: حركة واحدة، أو كل حركات يوم من التقويم.

// موجة ٣: التعديل لحد ما الحركة تنزل «💸 سجل الفلوس»، وبعدها الملف هو المالك والتصليح برسالة لكلود.
function itemActions(it) {
  if (it.cancelled) return it.locked
    ? `<div class="lock">🔒 الحركة دي اتلغت، ونزلت في 💸 «سجل الفلوس» بعلامة ❌.</div>`
    : `<div class="lock">❌ الحركة دي اتلغت من اللوحة، ومش محسوبة في أي رقم.</div><div class="acts"><button data-act="restore" data-v="${it.id}">↩️ رجّع الحركة</button></div>`;
  if (it.status === 'synced_to_file') return `<div class="lock">🔒 الحركة دي نزلت في 💸 «سجل الفلوس»، فالملف بقى هو المالك. ولو عايز تصلّح حاجة، ابعت لكلود.</div>`;
  return `<div class="acts">` + (it.kind === 'income' ? '' : `<button data-act="pickcat" data-v="${it.id}">🏷️ غيّر التصنيف</button>`) +
    `<button class="warn" data-act="cancel1" data-v="${it.id}">❌ إلغاء الحركة</button></div>`;
}
function pickCategory(id) {
  const it = byId[id]; if (!it) return;
  const names = Object.keys(ICON).filter((c) => c !== 'دخل ATM');
  openSheet(`<div class="shhd">🏷️<b>اختار التصنيف</b></div><div class="cats">` +
    names.map((c) => `<button data-act="setcat" data-v="${it.id}" data-c="${esc(c)}" class="${c === it.category ? 'on' : ''}">${label(c)}</button>`).join('') + `</div>`);
}
const RESULT = { changed: '✅ اتعمل', same: '👌 مفيش تغيير', locked: '🔒 الحركة نزلت الملف خلاص، فالتصليح برسالة لكلود', missing: '⚠️ الحركة مش موجودة', bad: '⚠️ التصنيف ده ما ينفعش هنا' };
async function doWrite(body) {
  sheet.querySelectorAll('button').forEach((b) => { b.disabled = true; });
  let msg;
  try {
    const r = await fetch(WRITE, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ initData: tg.initData, ...body }) });
    if (r.status === 401) throw new Error('مش قادر أتأكد إنه إنت. اقفل اللوحة وافتحها تاني من زرار البوت.');
    if (!r.ok) throw new Error('في عطل في الاتصال. جرّب تاني.');
    const res = (await r.json()).result;
    msg = RESULT[res] || '⚠️ رد غريب من الباب';
    if (res === 'changed') {
      Object.keys(cache).forEach((k) => delete cache[k]);
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    }
  } catch (e) { msg = '⚠️ ' + e.message; }
  openSheet(`<div class="toast">${esc(msg)}</div>`);
  show();
}
function openDay(day) {
  const list = Object.values(byId).filter((i) => i.day === day).sort((a, b) => b.time.localeCompare(a.time));
  openSheet(`<div class="shhd">📅<b>${dayName(day)}</b></div>` + list.map((it) => itemRow(it, `<span class="ltr">${esc(it.time)}</span>`)).join(''));

function backBtn() {
  if (!tg || !tg.BackButton) return;
  sheet.classList.contains('on') || S.cat ? tg.BackButton.show() : tg.BackButton.hide();
}
function goBack() {
  if (sheet.classList.contains('on')) return closeSheet();

}

// تبويب «الأوامر»: نظرة سريعة. كارت مقفول فيه الحالة والعنوان والنتيجة و«👣 الجاي»،
// ورسالة مصطفى والأوقات بتفتح لما يدوس (اختيار مصطفى ١، 2026-10-28).
function ago(ts) {
  const m = Math.max(0, Math.round((Date.now() / 1000 - Number(ts)) / 60));
  if (m < 1) return 'دلوقتي';
  if (m < 60) return `من ${m} دقيقة`;
  const h = Math.round(m / 60);
  if (h < 24) return h === 1 ? 'من ساعة' : h === 2 ? 'من ساعتين' : `من ${h} ساعات`;
  const d = Math.round(h / 24);
  return d === 1 ? 'من يوم' : d === 2 ? 'من يومين' : `من ${d} أيام`;
}
const firstWords = (s) => String(s ?? '').trim().replace(/^\.\s*/, '').split(/\s+/).slice(0, 3).join(' ');
// الرقمين فوق فلاتر: دوسة توري نوع واحد، والدوسة التانية على نفس الرقم ترجّع الكل (اختيار مصطفى ١، 2026-10-28).
let cmdFilter = null;
function renderCommands(list) {
  if (!list.length) return app.innerHTML = '<div class="msg">مفيش أوامر لسه. ابعت للبوت سطر أوله نقطة.</div>';
  const done = list.filter((c) => c.status === 'done').length;
  const shown = list.filter((c) => !cmdFilter || (cmdFilter === 'done') === (c.status === 'done'));
  app.innerHTML = `<div class="kpis" style="margin-bottom:12px">
    <div class="stat waiting${cmdFilter === 'waiting' ? ' on' : ''}" data-f="waiting"><b>${list.length - done}</b><span>مستني</span></div>
    <div class="stat done${cmdFilter === 'done' ? ' on' : ''}" data-f="done"><b>${done}</b><span>اتنفّذ</span></div></div>` +
    (shown.length ? '' : '<div class="msg">مفيش أوامر هنا.</div>') +
    shown.map((c) => {
      const ok = c.status === 'done';
      const lines = String(c.note ?? '').split('\n').map((l) => l.trim()).filter(Boolean);
      const next = lines.filter((l) => l.startsWith('👣')).join(' · ');
      const sub = ok ? lines.filter((l) => !l.startsWith('👣')).join(' · ') : 'مستني جلسة كلود';
      const title = c.title || firstWords(c.body);
      return `<div class="card cmd ${esc(c.status)}">
        <div class="row"><span class="ic">${ok ? '✅' : '⏳'}</span>
          <div class="tt"><b>${esc(title)}</b><small>${esc(sub)}</small></div>
          <span class="ago">${ago(c.ts)}</span></div>
        ${next ? `<div class="next">${esc(next)}</div>` : ''}
        <div class="more">رسالتك: «${esc(c.body)}»<br>وصل <span class="ltr">${esc(c.received)}</span>${c.done ? ` · اتنفّذ <span class="ltr">${esc(c.done)}</span>` : ''}</div>
      </div>`;
    }).join('');
  app.querySelectorAll('.cmd').forEach((el) => el.addEventListener('click', () => el.classList.toggle('open')));
  app.querySelectorAll('.stat').forEach((el) => el.addEventListener('click', () => {
    cmdFilter = cmdFilter === el.dataset.f ? null : el.dataset.f;
    renderCommands(list);
  }));
}

async function post(body) {
  const r = await fetch(API, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ initData: tg.initData, ...body }) });
  if (!r.ok) throw new Error(`مش مسموح (${r.status}).`);
  return r.json();
}
async function getData(period) {
  if (!cache[period]) {
    cache[period] = await post({ period });
    if (Array.isArray(cache[period].months)) months = cache[period].months;
    if (cache[period].budget != null) budget = Number(cache[period].budget) || 0;
    if (Array.isArray(cache[period].cat_budgets)) catBudgets = cache[period].cat_budgets;
    if (Array.isArray(cache[period].cancelled)) cancelled = cache[period].cancelled;
    if (cache[period].accounts) accounts = cache[period].accounts;
  }
  return cache[period];
}
async function show() {
  document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.v === S.view));
  backBtn();
  if (!tg || !tg.initData) { app.innerHTML = '<div class="msg">افتح اللوحة من زرار البوت في تليجرام.</div>'; return; }
  const my = ++seq;
  app.innerHTML = '<div class="msg">بيحمّل…</div>';
  try {
    if (S.view === 'commands') {
      const d = await post({ view: 'commands' });
      if (my === seq) renderCommands(d.commands || []);
      return;
    }
    const d = await getData(S.view === 'reports' || S.view === 'accounts' ? 'month' : S.period);
    if (my !== seq) return;
    byId = {};
    if (S.view === 'accounts') renderAccounts(d.accounts);
    else if (S.view === 'reports') renderReports(d);
    else if (S.view === 'stats') S.cat ? renderCat(d) : renderStats(d);
    else renderTx(d);
  } catch (e) {
    if (my === seq) app.innerHTML = `<div class="msg">${esc(e.message.startsWith('مش') ? e.message : 'في عطل في الاتصال. جرّب تاني.')}</div>`;
  }
}

app.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const v = t.dataset.v;
  switch (t.dataset.act) {
    case 'period': S.period = v; S.cat = null; return show();
    case 'kind': S.kind = v; S.cat = null; return show();
    case 'mode': S.mode = v; return show();
    case 'sort': S.sort = v; return show();
    case 'cat': S.cat = v; S.catColor = t.dataset.c; S.sort = 'date'; window.scrollTo(0, 0); return show();
    // من كارت ميزانية تصنيف في التقارير: صفحة التصنيف نفسها في الإحصائيات، على الشهر ده.
    case 'bcat': S.view = 'stats'; S.kind = 'expense'; S.period = 'month'; S.cat = v; S.catColor = t.dataset.c; S.sort = 'date'; window.scrollTo(0, 0); return show();
    case 'back': return goBack();
    case 'eye':
      showBal = !showBal;
      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
      return renderAccounts(accounts);
    case 'item': return openItem(v);
    case 'day': return openDay(v);
    case 'page': return app.querySelector('.pager').children[Number(v)].scrollIntoView({ inline: 'start', block: 'nearest', behavior: 'smooth' });
    case 'month': {
      const cur = curMonth();
      S.view = 'tx'; S.cat = null; S.period = v === cur ? 'month' : v === prevMonth(cur) ? 'last_month' : v;
      return show();
    }
  }
});
sheet.addEventListener('click', (e) => {
  if (e.target === sheet) return closeSheet();
  const t = e.target.closest('[data-act]'); if (!t) return;
  const v = t.dataset.v;
  switch (t.dataset.act) {
    case 'close': return closeSheet();
    case 'item': return openItem(v);
    case 'pickcat': return pickCategory(v);
    case 'setcat': return doWrite({ action: 'category', id: Number(v), category: t.dataset.c });
    // الإلغاء بدوستين: الأولى بتقلب الزرار «اضغط تاني للتأكيد»، والتانية بتلغي.
    case 'cancel1': t.dataset.act = 'cancel2'; t.className = 'sure'; t.textContent = 'اضغط تاني للتأكيد'; return;
    case 'cancel2': return doWrite({ action: 'cancel', id: Number(v) });
    case 'restore': return doWrite({ action: 'restore', id: Number(v) });
  }
});
if (tg && tg.BackButton) tg.BackButton.onClick(goBack);
document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => { S.view = b.dataset.v; S.cat = null; showBal = false; closeSheet(); show(); }));
const startTab = new URLSearchParams(location.search).get('tab');
if (['tx', 'stats', 'accounts', 'reports', 'commands'].includes(startTab)) S.view = startTab;
show();
</script>
</body>
